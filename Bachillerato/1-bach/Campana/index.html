<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La palabra en campaña — 1º de Bachillerato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1a4a7a;
  --azul-osc:#0f2f4d;
  --turquesa:#0e9aa7;
  --terracota:#c64829;
  --oro:#c9973a;
  --crema:#faf7f1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--crema);
  font-family:'Source Sans 3', Arial, sans-serif;
  color:#2a2a28;
  line-height:1.6;
}
h1,h2,h3,h4{
  font-family:'Playfair Display', Georgia, serif;
  color:var(--azul-osc);
  font-weight:700;
  margin-top:0;
}
a{color:var(--terracota);}

header.top{
  background:var(--azul);
  color:#fff;
  padding:22px 24px 0 24px;
}
.top-inner{
  max-width:980px;
  margin:0 auto;
}
.eyebrow{
  font-family:'Source Sans 3', sans-serif;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:.78rem;
  color:#a9d9dc;
  margin:0 0 6px 0;
}
h1.title{
  font-size:1.9rem;
  color:#fff;
  margin:0 0 4px 0;
}
p.subtitle{
  margin:0 0 18px 0;
  color:rgba(255,255,255,.8);
  font-size:1rem;
  max-width:640px;
}

nav.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:2px;
  border-top:1px solid rgba(255,255,255,.15);
  padding-top:2px;
}
button.tab{
  appearance:none;
  border:none;
  background:transparent;
  color:rgba(255,255,255,.55);
  font-family:'Source Sans 3', sans-serif;
  font-size:.85rem;
  font-weight:600;
  padding:11px 14px 10px 14px;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:color .15s ease;
  white-space:nowrap;
}
button.tab:hover{color:rgba(255,255,255,.85);}
button.tab.active{
  color:#fff;
  border-bottom:3px solid var(--terracota);
}

div.mininav{
  background:var(--azul-osc);
  color:rgba(255,255,255,.85);
  font-size:.82rem;
  padding:9px 24px;
}
div.mininav .mininav-inner{
  max-width:980px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
div.mininav .crumb b{color:var(--oro);}
div.mininav .counter{color:rgba(255,255,255,.6);}

main{
  max-width:980px;
  margin:0 auto;
  padding:32px 24px 80px 24px;
}
.panel{display:none;}
.panel.active{display:block;}

h2.sec-title{
  font-size:1.45rem;
  border-bottom:2px solid var(--oro);
  padding-bottom:8px;
  margin:0 0 18px 0;
}
h2.sec-title:not(:first-child){margin-top:38px;}
h3.sub-title{
  font-size:1.12rem;
  color:var(--terracota);
  margin:22px 0 8px 0;
}
p.body-text{margin:0 0 12px 0;}
ul.body-list{margin:0 0 16px 0;padding-left:22px;}
ul.body-list li{margin-bottom:6px;}

.callout{
  background:var(--turquesa);
  color:#fff;
  border-radius:6px;
  padding:14px 18px;
  margin:18px 0;
  font-size:.95rem;
}
.callout .callout-label{
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:.72rem;
  display:block;
  margin-bottom:6px;
  color:#eafcfd;
}

.frag{
  background:#fff;
  border-left:4px solid var(--oro);
  border-radius:0 6px 6px 0;
  padding:16px 20px;
  margin:16px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.frag .frag-source{
  font-size:.78rem;
  color:#7a7a76;
  margin-top:10px;
  font-style:italic;
}
.frag p.dline{margin:0 0 6px 0;font-size:.96rem;}
.frag p.dline b{color:var(--azul-osc);}
.frag p.narr{margin:0 0 6px 0;font-size:.96rem;font-style:italic;}

table.data-table{
  border-collapse:collapse;
  width:100%;
  margin:14px 0 20px 0;
  font-size:.92rem;
}
table.data-table th{
  background:var(--azul-osc);
  color:#fff;
  text-align:left;
  padding:8px 10px;
}
table.data-table td{
  padding:8px 10px;
  border-bottom:1px solid #e3ddd0;
  vertical-align:top;
}
table.data-table tr:nth-child(even) td{background:#f3efe4;}

.qbox{
  border-left:4px solid var(--terracota);
  padding:6px 0 6px 16px;
  margin:16px 0;
  font-style:italic;
  color:#3a3a36;
}

.activity{
  background:#fff;
  border:1px solid #e3ddd0;
  border-radius:6px;
  padding:16px 20px;
  margin:18px 0;
}
.activity h4{
  color:var(--azul);
  margin:0 0 4px 0;
  font-family:'Source Sans 3', sans-serif;
  font-weight:700;
  font-size:.95rem;
}
.activity .level-tag{
  display:inline-block;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-weight:700;
  color:#fff;
  background:var(--oro);
  border-radius:3px;
  padding:2px 7px;
  margin-bottom:10px;
}
.activity ol{margin:0;padding-left:20px;}
.activity ol li{margin-bottom:6px;}
.activity p.open-prompt{margin:4px 0 0 0;}

textarea.answer-box{
  width:100%;
  min-height:90px;
  font-family:'Source Sans 3', sans-serif;
  font-size:.92rem;
  border:1px solid #d8d2c4;
  border-radius:4px;
  padding:10px;
  resize:vertical;
  margin-top:8px;
}

footer.page-footer{
  text-align:center;
  color:#8a8578;
  font-size:.78rem;
  padding:24px;
}

@media (max-width:640px){
  h1.title{font-size:1.5rem;}
  button.tab{font-size:.78rem;padding:9px 10px 9px 10px;}
}


/* ---- Actividades: tarjetas de partes y botones ---- */
.part-grid{display:grid;gap:14px;margin:18px 0;}
.part-card{
  background:#fff;
  border:1px solid #e3ddd0;
  border-left:4px solid var(--oro);
  border-radius:6px;
  padding:16px 20px;
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  align-items:center;
  justify-content:space-between;
}
.part-card .part-info{flex:1 1 340px;}
.part-card h3.part-title{font-size:1.05rem;color:var(--azul-osc);margin:0 0 4px 0;}
.part-card p.part-desc{margin:0;font-size:.92rem;color:#4a4a46;}
.part-card p.part-status{margin:6px 0 0 0;font-size:.78rem;color:#7a7a76;font-style:italic;}
a.btn{
  display:inline-block;
  background:var(--terracota);
  color:#fff;
  text-decoration:none;
  font-family:'Source Sans 3', sans-serif;
  font-weight:700;
  font-size:.9rem;
  padding:10px 20px;
  border-radius:4px;
  white-space:nowrap;
}
a.btn:hover{filter:brightness(1.08);}
a.btn.locked{background:#bdb6a6;cursor:not-allowed;pointer-events:none;}

/* ---- Páginas de actividades ---- */
.mininav a.back{color:#fff;text-decoration:none;font-weight:600;}
.mininav a.back:hover{text-decoration:underline;}
.task{background:#fff;border:1px solid #e3ddd0;border-radius:6px;padding:14px 18px 16px 18px;margin:14px 0;}
.task .task-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.task .task-num{font-family:'Playfair Display', Georgia, serif;font-weight:700;font-size:1.05rem;color:var(--terracota);}
.task .tag{display:inline-block;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:#fff;border-radius:3px;padding:2px 7px;}
.tag-literal{background:var(--turquesa);}
.tag-inferencia{background:var(--azul);}
.tag-forma{background:var(--oro);}
.tag-global{background:var(--terracota);}
.task p.task-text{margin:0;}
p.sec-note{margin:-6px 0 12px 0;font-size:.9rem;color:#5a5a55;font-style:italic;}

/* ---- La palabra en campaña: componentes propios ---- */
em{font-style:italic;}
.lead{font-size:1.05rem;color:#3a3a36;margin:0 0 16px 0;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0;}
.card{background:#fff;border:1px solid #e3ddd0;border-top:4px solid var(--oro);border-radius:6px;padding:14px 18px;}
.card h4{font-family:'Source Sans 3',sans-serif;color:var(--azul);margin:0 0 6px 0;font-size:.98rem;}
.card p{margin:0;font-size:.93rem;}
.callout.warm{background:#fff;color:#2a2a28;border-left:4px solid var(--terracota);}
.callout.warm .callout-label{color:var(--terracota);}
.concept{background:#fff;border-left:4px solid var(--turquesa);border-radius:0 6px 6px 0;padding:12px 18px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.concept .c-term{font-weight:700;color:var(--azul-osc);}
.concept p{margin:4px 0 0 0;font-size:.94rem;}
.session{background:#fff;border:1px solid #e3ddd0;border-radius:6px;margin:16px 0;overflow:hidden;}
.session > summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:14px;align-items:baseline;}
.session > summary::-webkit-details-marker{display:none;}
.session > summary .s-num{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:var(--terracota);font-size:1.15rem;min-width:28px;}
.session > summary .s-title{font-weight:700;color:var(--azul-osc);font-size:1.02rem;}
.session > summary .s-phase{margin-left:auto;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#8a8578;white-space:nowrap;}
.session[open] > summary{border-bottom:1px solid #e3ddd0;background:#fbf9f4;}
.session .s-body{padding:6px 20px 18px 20px;}
.phase-head{font-family:'Playfair Display',Georgia,serif;color:var(--azul);font-size:1.1rem;margin:28px 0 4px 0;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
button.btn2{appearance:none;border:1px solid var(--azul);background:#fff;color:var(--azul);font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:4px;cursor:pointer;}
button.btn2:hover{background:#eef3f8;}
button.btn2.primary{background:var(--terracota);border-color:var(--terracota);color:#fff;}
button.btn2.primary:hover{filter:brightness(1.08);}
button.btn2.danger{border-color:#a33;color:#a33;}
.lab-picker{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px 0;}
.lab-picker button{appearance:none;border:1px solid #d8d2c4;background:#fff;border-radius:4px;padding:8px 12px;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:.85rem;color:var(--azul-osc);text-align:left;}
.lab-picker button b{color:var(--terracota);margin-right:4px;}
.lab-picker button.active{background:var(--azul-osc);color:#fff;border-color:var(--azul-osc);}
.lab-picker button.active b{color:var(--oro);}
.ex{background:#fff;border:1px solid #e3ddd0;border-radius:6px;padding:14px 18px 12px 18px;margin:16px 0;}
.ex h4{font-family:'Source Sans 3',sans-serif;color:var(--azul);margin:0 0 4px 0;font-size:.98rem;}
.ex p.instr{margin:0 0 10px 0;font-size:.93rem;color:#4a4a46;}
.ex-item{display:grid;grid-template-columns:1fr minmax(160px,240px);gap:6px 14px;align-items:center;padding:8px 0;border-top:1px dashed #e3ddd0;}
.ex-item.stack{grid-template-columns:1fr;}
.ex-item .q{font-size:.95rem;}
.ex-item select,.ex-item input[type=text]{width:100%;font-family:'Source Sans 3',sans-serif;font-size:.92rem;padding:6px 8px;border:1px solid #d0c9b8;border-radius:4px;background:#fff;}
.ex-item.ok select,.ex-item.ok input[type=text]{border-color:#2e8b57;background:#eef8f1;}
.ex-item.ko select,.ex-item.ko input[type=text]{border-color:#c64829;background:#fcefeb;}
.ex-item .sol{grid-column:1 / -1;display:none;font-size:.88rem;color:#3d5a40;background:#f1f7f0;border-radius:4px;padding:6px 10px;}
.ex.show-sol .ex-item .sol{display:block;}
.ex .score{font-size:.85rem;font-weight:700;color:var(--azul);align-self:center;}
.model{display:none;background:#f1f7f0;border-left:4px solid #2e8b57;border-radius:0 4px 4px 0;padding:10px 14px;margin:8px 0;font-size:.92rem;}
.model p{margin:0 0 6px 0;}
.model.visible{display:block;}
.model .m-label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:#2e8b57;margin-bottom:4px;}
.dic-tip{font-size:.88rem;background:#fbf4e6;border:1px dashed var(--oro);border-radius:6px;padding:10px 14px;margin:18px 0;}
.dic-tip b{color:#8a6420;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px;}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--azul-osc);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.field input,.field select,.field textarea{width:100%;font-family:'Source Sans 3',sans-serif;font-size:.93rem;padding:7px 9px;border:1px solid #d0c9b8;border-radius:4px;background:#fff;}
.field textarea{min-height:64px;resize:vertical;}
.field.wide{grid-column:1 / -1;}
.field .hint{font-size:.78rem;color:#7a7a76;margin-top:2px;}
.progress{height:10px;background:#e8e2d4;border-radius:5px;overflow:hidden;margin:6px 0 4px 0;}
.progress > div{height:100%;background:var(--turquesa);width:0;transition:width .3s ease;}
.entry{background:#fff;border:1px solid #e3ddd0;border-left:4px solid var(--turquesa);border-radius:0 6px 6px 0;padding:12px 16px;margin:10px 0;}
.entry.example{border-left-color:var(--oro);background:#fffdf8;}
.entry .e-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;}
.entry .e-word{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.15rem;color:var(--azul-osc);}
.entry .e-cat{font-size:.82rem;color:#7a7a76;font-style:italic;}
.entry .e-tag{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:#fff;background:var(--azul);border-radius:3px;padding:2px 7px;}
.entry .e-tag.conn{background:var(--oro);}
.entry p{margin:5px 0 0 0;font-size:.92rem;}
.entry p b{color:var(--azul-osc);}
.entry .e-actions{margin-top:8px;display:flex;gap:6px;}
.wc{font-size:.82rem;color:#7a7a76;margin-top:4px;}
.wc.in{color:#2e8b57;font-weight:700;}
.wc.out{color:var(--terracota);font-weight:700;}
.checklist{list-style:none;padding:0;margin:8px 0 14px 0;}
.checklist li{padding:5px 0;border-bottom:1px dashed #e3ddd0;font-size:.93rem;}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
.checklist input{margin-top:4px;}
.model-text{background:#fff;border:1px solid #e3ddd0;border-radius:6px;padding:22px 28px;margin:16px 0;font-family:Georgia,serif;font-size:1rem;line-height:1.7;}
.model-text h4{font-family:'Playfair Display',Georgia,serif;font-size:1.3rem;margin:0 0 4px 0;}
.model-text .byline{text-indent:0;font-family:'Source Sans 3',sans-serif;font-size:.8rem;color:#8a8578;margin:0 0 14px 0;}
.model-text p{margin:0 0 12px 0;text-indent:1.5em;}
.model-text p .pnum{font-family:'Source Sans 3',sans-serif;font-size:.7rem;color:var(--oro);font-weight:700;margin-left:-1.5em;margin-right:.6em;}
.frames{list-style:none;padding:0;margin:8px 0 14px 0;}
.frames li{background:#f6f2e8;border-radius:4px;padding:6px 12px;margin:5px 0;font-size:.93rem;}
input.search{width:100%;max-width:380px;font-family:'Source Sans 3',sans-serif;font-size:.95rem;padding:8px 12px;border:1px solid #d0c9b8;border-radius:4px;margin:6px 0 12px 0;}
.print-btn{float:right;margin-top:-4px;}
.saved-note{font-size:.78rem;color:#7a7a76;font-style:italic;margin:4px 0 0 0;}
@media (max-width:640px){
  .ex-item{grid-template-columns:1fr;}
  .model-text{padding:16px 16px;}
  .print-btn{display:none;}
  .session > summary .s-phase{display:none;}
}
@media print{
  header.top nav, .mininav, .btn-row, .lab-picker, .print-btn, .e-actions, footer.page-footer{display:none !important;}
  header.top{background:#fff;color:#000;padding:0 0 8px 0;border-bottom:2px solid #1a4a7a;}
  header.top h1.title{color:#1a4a7a;}
  header.top .eyebrow, header.top p.subtitle{color:#555;}
  body{background:#fff;}
  main{padding:12px 0;max-width:none;}
  .callout{background:#fff;color:#000;border:1px solid #0e9aa7;}
  .callout .callout-label{color:#0e9aa7;}
  details.session{break-inside:avoid;}
  details.session > summary .s-phase{display:inline;}
  .ex, .card, .entry, .concept{break-inside:avoid;box-shadow:none;}
  textarea.answer-box{min-height:120px;border:1px solid #999;}
  .lab-single{display:none !important;}
  .lab-single.print-me{display:block !important;}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <p class="eyebrow">1º de Bachillerato · Comunicación y reflexión sobre la lengua</p>
    <h1 class="title">La palabra en campaña</h1>
    <p class="subtitle">Prensa, sesgo y léxico en unas elecciones. Situación de aprendizaje sobre las elecciones generales del 29 de noviembre.</p>
    <nav class="tabs" id="tabs-nav"></nav>
  </div>
</header>
<div class="mininav">
  <div class="mininav-inner">
    <span class="crumb" id="mininav-crumb"></span>
    <span class="counter" id="mininav-counter"></span>
  </div>
</div>
<main>
  <div id="content-root"></div>
</main>
<footer class="page-footer">Material de estudio y práctica · Lengua Castellana y Literatura I</footer>
<script>
(function () {
  'use strict';
  var PREFIX = 'campana1bach:';

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.className) node.className = opts.className;
    if (opts.text) node.appendChild(document.createTextNode(opts.text));
    if (opts.rich) node.appendChild(rich(opts.rich));
    if (opts.attrs) {
      for (var k in opts.attrs) {
        if (Object.prototype.hasOwnProperty.call(opts.attrs, k)) node.setAttribute(k, opts.attrs[k]);
      }
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }
  function txt(s) { return document.createTextNode(s); }

  /* Marcado mínimo: **negrita** y *cursiva*. Construye nodos, sin innerHTML. */
  function rich(s) {
    var frag = document.createDocumentFragment();
    var re = /\*\*([^*]+)\*\*|\*([^*]+)\*/g;
    var last = 0, m;
    s = String(s);
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) frag.appendChild(txt(s.slice(last, m.index)));
      if (m[1] !== undefined) frag.appendChild(el('strong', { text: m[1] }));
      else frag.appendChild(el('em', { text: m[2] }));
      last = re.lastIndex;
    }
    if (last < s.length) frag.appendChild(txt(s.slice(last)));
    return frag;
  }

  function h2(text) { return el('h2', { className: 'sec-title', text: text }); }
  function h3(text) { return el('h3', { className: 'sub-title', text: text }); }
  function p(text, cls) { return el('p', { className: cls || 'body-text', rich: text }); }
  function ul(items) {
    return el('ul', { className: 'body-list' }, items.map(function (i) { return el('li', { rich: i }); }));
  }
  function ol(items) {
    return el('ol', { className: 'body-list' }, items.map(function (i) { return el('li', { rich: i }); }));
  }
  function callout(label, text, extra) {
    return el('div', { className: 'callout' + (extra ? ' ' + extra : '') }, [
      el('span', { className: 'callout-label', text: label }),
      rich(text)
    ]);
  }
  function concept(term, def) {
    return el('div', { className: 'concept' }, [
      el('span', { className: 'c-term', text: term }),
      el('p', { rich: def })
    ]);
  }
  function table(headers, rows) {
    var thead = el('tr', {}, headers.map(function (h) { return el('th', { text: h }); }));
    var tbody = rows.map(function (r) {
      return el('tr', {}, r.map(function (c) { return el('td', { rich: c }); }));
    });
    return el('table', { className: 'data-table' }, [el('thead', {}, [thead]), el('tbody', {}, tbody)]);
  }
  function frames(items) {
    return el('ul', { className: 'frames' }, items.map(function (i) { return el('li', { rich: i }); }));
  }

  var store = {
    get: function (key) {
      try { return window.localStorage.getItem(PREFIX + key) || ''; } catch (e) { return ''; }
    },
    set: function (key, value) {
      try { window.localStorage.setItem(PREFIX + key, value); } catch (e) { /* sin almacenamiento */ }
    },
    getJSON: function (key, fallback) {
      var raw = store.get(key);
      if (!raw) return fallback;

  function closedExercise(ex, key) {

    if (ex.instr) box.appendChild(el('p', { className: 'instr', rich: ex.instr }));

    ex.items.forEach(function (it, i) {
      var k = key + ':' + i;
      var control;
      if (ex.type === 'select') {
        control = el('select', {}, [el('option', { attrs: { value: '' }, text: '— elige —' })].concat(
          (it.options || ex.options).map(function (o) { return el('option', { attrs: { value: o }, text: o }); })
        ));
      } else {
        control = el('input', { attrs: { type: 'text', autocomplete: 'off', spellcheck: 'false', placeholder: it.ph || 'Escribe aquí' } });
      }
      control.value = C.store.get(k);
      var row = el('div', { className: 'ex-item' + (it.stack ? ' stack' : '') }, [
        el('div', { className: 'q', rich: it.q }),
        control
      ]);
      var answers = Array.isArray(it.a) ? it.a : [it.a];
      var solText = '**Solución:** ' + answers[0] + (it.why ? '. ' + it.why : '');
      row.appendChild(el('div', { className: 'sol', rich: solText }));
      control.addEventListener(ex.type === 'select' ? 'change' : 'input', function () {
        C.store.set(k, control.value);
        row.classList.remove('ok', 'ko');
      });
      rows.push({ row: row, control: control, answers: answers });
      box.appendChild(row);
    });
    var score = el('span', { className: 'score' });
    var check = el('button', { className: 'btn2 primary', attrs: { type: 'button' }, text: 'Comprobar' });
    var show = el('button', { className: 'btn2', attrs: { type: 'button' }, text: 'Ver soluciones' });
    var reset = el('button', { className: 'btn2', attrs: { type: 'button' }, text: 'Borrar' });
    check.addEventListener('click', function () {
      var ok = 0;
      rows.forEach(function (r) {

        var good = r.answers.some(function (a) { return norm(a, ex.exact) === v; });
        r.row.classList.remove('ok', 'ko');
        if (v) r.row.classList.add(good ? 'ok' : 'ko');

  var labNodes = [];

  function showLab(n) {
    labNodes.forEach(function (node, i) {

      pickerButtons[i].classList.toggle('active', on);

  }

    var box = el('div', { className: 'lab-single' });

    L.keys.forEach(function (k) { box.appendChild(C.concept(k[0], k[1])); });
    L.ex.forEach(function (ex, i) { box.appendChild(C.exercise(ex, 'lab' + L.n + 'e' + i)); });

    if (L.goTab) {
      var gb = el('button', { className: 'btn2', attrs: { type: 'button' }, text: L.goTab[0] });
      gb.addEventListener('click', function () { C.goTo(L.goTab[1]); });
      btns.push(gb);
    }
    box.appendChild(el('div', { className: 'btn-row' }, btns));
    return box;
  }

  function build() {
    var panel = C.panel('laboratorio');
    panel.appendChild(C.printButton());
    panel.appendChild(C.h2('Laboratorio de palabras'));
    panel.appendChild(p('Nueve fichas, una por sesión. En los ejercicios cerrados puedes **comprobar** tus respuestas y ver las soluciones; en los abiertos, escribe primero y consulta después la propuesta. La impresora saca solo la ficha que tengas abierta.'));
    var picker = el('div', { className: 'lab-picker' });
    LABS.forEach(function (L) {
      var b = el('button', { attrs: { type: 'button' } }, [el('b', { text: String(L.n) }), L.title]);
      b.addEventListener('click', function () { showLab(L.n); });
      pickerButtons.push(b);
      picker.appendChild(b);
    });
    panel.appendChild(picker);
    LABS.forEach(function (L) {
      var node = labBlock(L);
      labNodes.push(node);
      panel.appendChild(node);
    });
    document.getElementById('content-root').appendChild(panel);
    var saved = parseInt(C.store.get('lab-actual'), 10);
    showLab(saved >= 1 && saved <= LABS.length ? saved : 1);

  C.openLab = function (n) {
    showLab(n);
    C.goTo('laboratorio');
  };
  C.builders.push(build);
})();

      'He evitado *___* por su connotación ___ y he preferido *___*.',
      'Uso la primera persona del plural en «___» para ___.',
      'El contraargumento «___» me sirve para ___.'
    ]));
    var note = C.savedArea('col-nota', 'Nota de decisiones...', '160px');
    panel.appendChild(note);
    panel.appendChild(wordCounter(note, 150, 200));

    panel.appendChild(h3('5. Entrega'));
    var copyB = el('button', { className: 'btn2 primary', attrs: { type: 'button' }, text: 'Copiar columna y nota' });
    var dlB = el('button', { className: 'btn2', attrs: { type: 'button' }, text: 'Descargar (.txt)' });
    function compose() {
      var plan = PLAN.map(function (f) { return f.label + ': ' + (planInputs[f.k].ctrl.value || ''); }).join('\n');
      return (titleIn.value || 'Sin título').toUpperCase() + '\n\n' + draft.value + '\n\n— — —\nNOTA DE DECISIONES LINGÜÍSTICAS\n\n' + note.value + '\n\n— — —\nPLANIFICACIÓN\n\n' + plan;
    }
    copyB.addEventListener('click', function () { C.copyText(compose(), copyB); });
    dlB.addEventListener('click', function () { C.downloadText('columna-de-opinion.txt', compose()); });
    panel.appendChild(el('div', { className: 'btn-row' }, [copyB, dlB]));
    panel.appendChild(p('Pega el texto en el documento de entrega que se te indique y revisa allí el formato.', 'saved-note'));

    document.getElementById('content-root').appendChild(panel);
  }
  C.builders.push(build);
})();

(function () {
  'use strict';
  var C = window.CAMP;

  function init() {
    var tabsNav = document.getElementById('tabs-nav');
    var crumb = document.getElementById('mininav-crumb');
    var counter = document.getElementById('mininav-counter');

    C.builders.forEach(function (fn) { fn(); });

    C.TABS.forEach(function (t) {
      var btn = document.createElement('button');
      btn.className = 'tab';
      btn.type = 'button';
      btn.setAttribute('data-tab', t.id);
      btn.appendChild(document.createTextNode(t.label));
      btn.addEventListener('click', function () { activate(t.id); });
      tabsNav.appendChild(btn);
    });

    function activate(id) {
      var panels = document.querySelectorAll('.panel');
      for (var i = 0; i < panels.length; i++) panels[i].classList.remove('active');
      var target = document.getElementById('panel-' + id);
      if (target) target.classList.add('active');
      var buttons = tabsNav.querySelectorAll('.tab');
      for (var j = 0; j < buttons.length; j++) buttons[j].classList.remove('active');
      var activeBtn = tabsNav.querySelector('[data-tab="' + id + '"]');
      if (activeBtn) activeBtn.classList.add('active');
      var info = C.TABS.filter(function (t) { return t.id === id; })[0];
      if (info) {
        crumb.textContent = '';
        var b = document.createElement('b');
        b.appendChild(document.createTextNode(info.label));
        crumb.appendChild(document.createTextNode('La palabra en campaña — '));
        crumb.appendChild(b);
      }
      var pos = C.TABS.findIndex(function (t) { return t.id === id; }) + 1;
      counter.textContent = pos + ' / ' + C.TABS.length;
      C.store.set('tab-actual', id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    C.goTo = activate;

    /* Al imprimir, se abren todos los desplegables */
    var reopened = [];
    window.addEventListener('beforeprint', function () {
      reopened = [];
      var ds = document.querySelectorAll('.panel.active details');
      for (var i = 0; i < ds.length; i++) {
        if (!ds[i].open) { ds[i].open = true; reopened.push(ds[i]); }
      }
    });
    window.addEventListener('afterprint', function () {
      reopened.forEach(function (d) { d.open = false; });
      reopened = [];
    });

    var saved = C.store.get('tab-actual');
    var valid = C.TABS.some(function (t) { return t.id === saved; });
    activate(valid ? saved : C.TABS[0].id);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
