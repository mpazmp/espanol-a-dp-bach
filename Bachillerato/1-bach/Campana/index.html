<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La palabra en campaña — 1º de Bachillerato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1a4a7a;
  --azul-osc:#0f2f4d;
  --turquesa:#0e9aa7;
  --terracota:#c64829;
  --oro:#c9973a;
  --crema:#faf7f1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--crema);
  font-family:'Source Sans 3', Arial, sans-serif;
  color:#2a2a28;
  line-height:1.6;
}
h1,h2,h3,h4{
  font-family:'Playfair Display', Georgia, serif;
  color:var(--azul-osc);
  font-weight:700;
  margin-top:0;
}
a{color:var(--terracota);}

header.top{
  background:var(--azul);
  color:#fff;
  padding:22px 24px 0 24px;
}
.top-inner{
  max-width:980px;
  margin:0 auto;
}
.eyebrow{
  font-family:'Source Sans 3', sans-serif;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:.78rem;
  color:#a9d9dc;
  margin:0 0 6px 0;
}
h1.title{
  font-size:1.9rem;
  color:#fff;
  margin:0 0 4px 0;
}
p.subtitle{
  margin:0 0 18px 0;
  color:rgba(255,255,255,.8);
  font-size:1rem;
  max-width:640px;
}

nav.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:2px;
  border-top:1px solid rgba(255,255,255,.15);
  padding-top:2px;
}
button.tab{
  appearance:none;
  border:none;
  background:transparent;
  color:rgba(255,255,255,.55);
  font-family:'Source Sans 3', sans-serif;
  font-size:.85rem;
  font-weight:600;
  padding:11px 14px 10px 14px;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:color .15s ease;
  white-space:nowrap;
}
button.tab:hover{color:rgba(255,255,255,.85);}
button.tab.active{
  color:#fff;
  border-bottom:3px solid var(--terracota);
}

div.mininav{
  background:var(--azul-osc);
  color:rgba(255,255,255,.85);
  font-size:.82rem;
  padding:9px 24px;
}
div.mininav .mininav-inner{
  max-width:980px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
div.mininav .crumb b{color:var(--oro);}
div.mininav .counter{color:rgba(255,255,255,.6);}

main{
  max-width:980px;
  margin:0 auto;
  padding:32px 24px 80px 24px;
}
.panel{display:none;}
.panel.active{display:block;}

h2.sec-title{
  font-size:1.45rem;
  border-bottom:2px solid var(--oro);
  padding-bottom:8px;
  margin:0 0 18px 0;
}
h2.sec-title:not(:first-child){margin-top:38px;}
h3.sub-title{
  font-size:1.12rem;
  color:var(--terracota);
  margin:22px 0 8px 0;
}
p.body-text{margin:0 0 12px 0;}
ul.body-list{margin:0 0 16px 0;padding-left:22px;}
ul.body-list li{margin-bottom:6px;}

.callout{
  background:var(--turquesa);
  color:#fff;
  border-radius:6px;
  padding:14px 18px;
  margin:18px 0;
  font-size:.95rem;
}
.callout .callout-label{
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:.72rem;
  display:block;
  margin-bottom:6px;
  color:#eafcfd;
}

.frag{
  background:#fff;
  border-left:4px solid var(--oro);
  border-radius:0 6px 6px 0;
  padding:16px 20px;
  margin:16px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.frag .frag-source{
  font-size:.78rem;
  color:#7a7a76;
  margin-top:10px;
  font-style:italic;
}
.frag p.dline{margin:0 0 6px 0;font-size:.96rem;}
.frag p.dline b{color:var(--azul-osc);}
.frag p.narr{margin:0 0 6px 0;font-size:.96rem;font-style:italic;}

table.data-table{
  border-collapse:collapse;
  width:100%;
  margin:14px 0 20px 0;
  font-size:.92rem;
}
table.data-table th{
  background:var(--azul-osc);
  color:#fff;
  text-align:left;
  padding:8px 10px;
}
table.data-table td{
  padding:8px 10px;
  border-bottom:1px solid #e3ddd0;
  vertical-align:top;
}
table.data-table tr:nth-child(even) td{background:#f3efe4;}

.qbox{
  border-left:4px solid var(--terracota);
  padding:6px 0 6px 16px;
  margin:16px 0;
  font-style:italic;
  color:#3a3a36;
}

.activity{
  background:#fff;
  border:1px solid #e3ddd0;
  border-radius:6px;
  padding:16px 20px;
  margin:18px 0;
}
.activity h4{
  color:var(--azul);
  margin:0 0 4px 0;
  font-family:'Source Sans 3', sans-serif;
  font-weight:700;
  font-size:.95rem;
}
.activity .level-tag{
  display:inline-block;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-weight:700;
  color:#fff;
  background:var(--oro);
  border-radius:3px;
  padding:2px 7px;
  margin-bottom:10px;
}
.activity ol{margin:0;padding-left:20px;}
.activity ol li{margin-bottom:6px;}
.activity p.open-prompt{margin:4px 0 0 0;}

textarea.answer-box{
  width:100%;
  min-height:90px;
  font-family:'Source Sans 3', sans-serif;
  font-size:.92rem;
  border:1px solid #d8d2c4;
  border-radius:4px;
  padding:10px;
  resize:vertical;
  margin-top:8px;
}

footer.page-footer{
  text-align:center;
  color:#8a8578;
  font-size:.78rem;
  padding:24px;
}

@media (max-width:640px){
  h1.title{font-size:1.5rem;}
  button.tab{font-size:.78rem;padding:9px 10px 9px 10px;}
}


/* ---- Actividades: tarjetas de partes y botones ---- */
.part-grid{display:grid;gap:14px;margin:18px 0;}
.part-card{
  background:#fff;
  border:1px solid #e3ddd0;
  border-left:4px solid var(--oro);
  border-radius:6px;
  padding:16px 20px;
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  align-items:center;
  justify-content:space-between;
}
.part-card .part-info{flex:1 1 340px;}
.part-card h3.part-title{font-size:1.05rem;color:var(--azul-osc);margin:0 0 4px 0;}
.part-card p.part-desc{margin:0;font-size:.92rem;color:#4a4a46;}
.part-card p.part-status{margin:6px 0 0 0;font-size:.78rem;color:#7a7a76;font-style:italic;}
a.btn{
  display:inline-block;
  background:var(--terracota);
  color:#fff;
  text-decoration:none;
  font-family:'Source Sans 3', sans-serif;
  font-weight:700;
  font-size:.9rem;
  padding:10px 20px;
  border-radius:4px;
  white-space:nowrap;
}
a.btn:hover{filter:brightness(1.08);}
a.btn.locked{background:#bdb6a6;cursor:not-allowed;pointer-events:none;}

/* ---- Páginas de actividades ---- */
.mininav a.back{color:#fff;text-decoration:none;font-weight:600;}
.mininav a.back:hover{text-decoration:underline;}
.task{background:#fff;border:1px solid #e3ddd0;border-radius:6px;padding:14px 18px 16px 18px;margin:14px 0;}
.task .task-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.task .task-num{font-family:'Playfair Display', Georgia, serif;font-weight:700;font-size:1.05rem;color:var(--terracota);}
.task .tag{display:inline-block;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:#fff;border-radius:3px;padding:2px 7px;}
.tag-literal{background:var(--turquesa);}
.tag-inferencia{background:var(--azul);}
.tag-forma{background:var(--oro);}
.tag-global{background:var(--terracota);}
.task p.task-text{margin:0;}
p.sec-note{margin:-6px 0 12px 0;font-size:.9rem;color:#5a5a55;font-style:italic;}

/* ---- La palabra en campaña: componentes propios ---- */
em{font-style:italic;}
.lead{font-size:1.05rem;color:#3a3a36;margin:0 0 16px 0;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0;}
.card{background:#fff;border:1px solid #e3ddd0;border-top:4px solid var(--oro);border-radius:6px;padding:14px 18px;}
.card h4{font-family:'Source Sans 3',sans-serif;color:var(--azul);margin:0 0 6px 0;font-size:.98rem;}
.card p{margin:0;font-size:.93rem;}
.callout.warm{background:#fff;color:#2a2a28;border-left:4px solid var(--terracota);}
.callout.warm .callout-label{color:var(--terracota);}
.concept{background:#fff;border-left:4px solid var(--turquesa);border-radius:0 6px 6px 0;padding:12px 18px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.concept .c-term{font-weight:700;color:var(--azul-osc);}
.concept p{margin:4px 0 0 0;font-size:.94rem;}
.session{background:#fff;border:1px solid #e3ddd0;border-radius:6px;margin:16px 0;overflow:hidden;}
.session > summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:14px;align-items:baseline;}
.session > summary::-webkit-details-marker{display:none;}
.session > summary .s-num{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:var(--terracota);font-size:1.15rem;min-width:28px;}
.session > summary .s-title{font-weight:700;color:var(--azul-osc);font-size:1.02rem;}
.session > summary .s-phase{margin-left:auto;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#8a8578;white-space:nowrap;}
.session[open] > summary{border-bottom:1px solid #e3ddd0;background:#fbf9f4;}
.session .s-body{padding:6px 20px 18px 20px;}
.phase-head{font-family:'Playfair Display',Georgia,serif;color:var(--azul);font-size:1.1rem;margin:28px 0 4px 0;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
button.btn2{appearance:none;border:1px solid var(--azul);background:#fff;color:var(--azul);font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:4px;cursor:pointer;}
button.btn2:hover{background:#eef3f8;}
button.btn2.primary{background:var(--terracota);border-color:var(--terracota);color:#fff;}
button.btn2.primary:hover{filter:brightness(1.08);}
button.btn2.danger{border-color:#a33;color:#a33;}
.lab-picker{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px 0;}
.lab-picker button{appearance:none;border:1px solid #d8d2c4;background:#fff;border-radius:4px;padding:8px 12px;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:.85rem;color:var(--azul-osc);text-align:left;}
.lab-picker button b{color:var(--terracota);margin-right:4px;}
.lab-picker button.active{background:var(--azul-osc);color:#fff;border-color:var(--azul-osc);}
.lab-picker button.active b{color:var(--oro);}
.ex{background:#fff;border:1px solid #e3ddd0;border-radius:6px;padding:14px 18px 12px 18px;margin:16px 0;}
.ex h4{font-family:'Source Sans 3',sans-serif;color:var(--azul);margin:0 0 4px 0;font-size:.98rem;}
.ex p.instr{margin:0 0 10px 0;font-size:.93rem;color:#4a4a46;}
.ex-item{display:grid;grid-template-columns:1fr minmax(160px,240px);gap:6px 14px;align-items:center;padding:8px 0;border-top:1px dashed #e3ddd0;}
.ex-item.stack{grid-template-columns:1fr;}
.ex-item .q{font-size:.95rem;}
.ex-item select,.ex-item input[type=text]{width:100%;font-family:'Source Sans 3',sans-serif;font-size:.92rem;padding:6px 8px;border:1px solid #d0c9b8;border-radius:4px;background:#fff;}
.ex-item.ok select,.ex-item.ok input[type=text]{border-color:#2e8b57;background:#eef8f1;}
.ex-item.ko select,.ex-item.ko input[type=text]{border-color:#c64829;background:#fcefeb;}
.ex-item .sol{grid-column:1 / -1;display:none;font-size:.88rem;color:#3d5a40;background:#f1f7f0;border-radius:4px;padding:6px 10px;}
.ex.show-sol .ex-item .sol{display:block;}
.ex .score{font-size:.85rem;font-weight:700;color:var(--azul);align-self:center;}
.model{display:none;background:#f1f7f0;border-left:4px solid #2e8b57;border-radius:0 4px 4px 0;padding:10px 14px;margin:8px 0;font-size:.92rem;}
.model p{margin:0 0 6px 0;}
.model.visible{display:block;}
.model .m-label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:#2e8b57;margin-bottom:4px;}
.dic-tip{font-size:.88rem;background:#fbf4e6;border:1px dashed var(--oro);border-radius:6px;padding:10px 14px;margin:18px 0;}
.dic-tip b{color:#8a6420;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px;}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--azul-osc);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.field input,.field select,.field textarea{width:100%;font-family:'Source Sans 3',sans-serif;font-size:.93rem;padding:7px 9px;border:1px solid #d0c9b8;border-radius:4px;background:#fff;}
.field textarea{min-height:64px;resize:vertical;}
.field.wide{grid-column:1 / -1;}
.field .hint{font-size:.78rem;color:#7a7a76;margin-top:2px;}
.progress{height:10px;background:#e8e2d4;border-radius:5px;overflow:hidden;margin:6px 0 4px 0;}
.progress > div{height:100%;background:var(--turquesa);width:0;transition:width .3s ease;}
.entry{background:#fff;border:1px solid #e3ddd0;border-left:4px solid var(--turquesa);border-radius:0 6px 6px 0;padding:12px 16px;margin:10px 0;}
.entry.example{border-left-color:var(--oro);background:#fffdf8;}
.entry .e-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;}
.entry .e-word{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.15rem;color:var(--azul-osc);}
.entry .e-cat{font-size:.82rem;color:#7a7a76;font-style:italic;}
.entry .e-tag{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:#fff;background:var(--azul);border-radius:3px;padding:2px 7px;}
.entry .e-tag.conn{background:var(--oro);}
.entry p{margin:5px 0 0 0;font-size:.92rem;}
.entry p b{color:var(--azul-osc);}
.entry .e-actions{margin-top:8px;display:flex;gap:6px;}
.wc{font-size:.82rem;color:#7a7a76;margin-top:4px;}
.wc.in{color:#2e8b57;font-weight:700;}
.wc.out{color:var(--terracota);font-weight:700;}
.checklist{list-style:none;padding:0;margin:8px 0 14px 0;}
.checklist li{padding:5px 0;border-bottom:1px dashed #e3ddd0;font-size:.93rem;}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
.checklist input{margin-top:4px;}
.model-text{background:#fff;border:1px solid #e3ddd0;border-radius:6px;padding:22px 28px;margin:16px 0;font-family:Georgia,serif;font-size:1rem;line-height:1.7;}
.model-text h4{font-family:'Playfair Display',Georgia,serif;font-size:1.3rem;margin:0 0 4px 0;}
.model-text .byline{text-indent:0;font-family:'Source Sans 3',sans-serif;font-size:.8rem;color:#8a8578;margin:0 0 14px 0;}
.model-text p{margin:0 0 12px 0;text-indent:1.5em;}
.model-text p .pnum{font-family:'Source Sans 3',sans-serif;font-size:.7rem;color:var(--oro);font-weight:700;margin-left:-1.5em;margin-right:.6em;}
.frames{list-style:none;padding:0;margin:8px 0 14px 0;}
.frames li{background:#f6f2e8;border-radius:4px;padding:6px 12px;margin:5px 0;font-size:.93rem;}
input.search{width:100%;max-width:380px;font-family:'Source Sans 3',sans-serif;font-size:.95rem;padding:8px 12px;border:1px solid #d0c9b8;border-radius:4px;margin:6px 0 12px 0;}
.print-btn{float:right;margin-top:-4px;}
.saved-note{font-size:.78rem;color:#7a7a76;font-style:italic;margin:4px 0 0 0;}
@media (max-width:640px){
  .ex-item{grid-template-columns:1fr;}
  .model-text{padding:16px 16px;}
  .print-btn{display:none;}
  .session > summary .s-phase{display:none;}
}
@media print{
  header.top nav, .mininav, .btn-row, .lab-picker, .print-btn, .e-actions, footer.page-footer{display:none !important;}
  header.top{background:#fff;color:#000;padding:0 0 8px 0;border-bottom:2px solid #1a4a7a;}
  header.top h1.title{color:#1a4a7a;}
  header.top .eyebrow, header.top p.subtitle{color:#555;}
  body{background:#fff;}
  main{padding:12px 0;max-width:none;}
  .callout{background:#fff;color:#000;border:1px solid #0e9aa7;}
  .callout .callout-label{color:#0e9aa7;}
  details.session{break-inside:avoid;}
  details.session > summary .s-phase{display:inline;}
  .ex, .card, .entry, .concept{break-inside:avoid;box-shadow:none;}
  textarea.answer-box{min-height:120px;border:1px solid #999;}
  .lab-single{display:none !important;}
  .lab-single.print-me{display:block !important;}
}
/* Barra de guardado en la nube */
div.nube{background:#e6f5f6;border-bottom:1px solid #b9e2e5;}
div.nube .nube-inner{max-width:980px;margin:0 auto;padding:.55rem 0;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;font-size:.95rem;}
div.nube .nube-nombre{color:var(--azul,#1a4a7a);}
div.nube .nube-estado{flex:1 1 260px;color:#2b4a5a;}
div.nube .nube-estado.ok{color:#1d6b3a;}
div.nube .nube-estado.pendiente, div.nube .nube-estado.enviando, div.nube .nube-estado.recuperando{color:#7a5a12;}
div.nube .nube-estado.error, div.nube .nube-estado.sin{color:#c64829;font-weight:600;}
div.nube .nube-botones{display:flex;gap:.5rem;}
div.nube .btn2{padding:5px 12px;}
@media (max-width:1020px){div.nube .nube-inner{padding:.55rem 20px;}}
.nube-fondo{position:fixed;inset:0;background:rgba(15,47,77,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
.nube-dialogo{background:#faf7f1;border-radius:10px;max-width:460px;width:100%;padding:1.4rem 1.5rem;box-shadow:0 10px 40px rgba(0,0,0,.3);border-top:5px solid #0e9aa7;}
.nube-dialogo h3{font-family:'Playfair Display',Georgia,serif;color:#1a4a7a;margin:0 0 .5rem;}
.nube-dialogo label{display:block;font-weight:600;margin:.8rem 0 .25rem;}
.nube-dialogo input{width:100%;box-sizing:border-box;padding:.5rem .6rem;border:1px solid #c9c2b4;border-radius:6px;font:inherit;}
.nube-dialogo .nube-aviso{color:#c64829;min-height:1.2em;margin:.6rem 0 0;}
@media print{div.nube{display:none !important;}}
/* Pestaña Teoría */
.teo-indice-box{background:#fff;border:1px solid #e3ddd0;border-left:4px solid var(--oro);border-radius:0 6px 6px 0;padding:12px 18px;margin:14px 0 24px;}
.teo-indice-label{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--oro);margin-bottom:6px;}
.teo-indice{margin:0;padding-left:0;list-style:none;columns:2;column-gap:28px;}
.teo-indice li{margin:3px 0;break-inside:avoid;}
.teo-indice a{color:var(--azul);text-decoration:none;font-weight:600;font-size:.93rem;}
.teo-indice a:hover{text-decoration:underline;}
.teo-sec{margin:30px 0 10px;padding-top:6px;scroll-margin-top:16px;}
.teo-sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;border-bottom:2px solid #e3ddd0;padding-bottom:6px;margin-bottom:10px;}
.teo-sec-title{font-family:'Playfair Display',Georgia,serif;color:var(--azul);font-size:1.25rem;margin:0;}
.teo-ses{font-size:.78rem;font-weight:700;color:#fff;background:var(--turquesa);border-radius:10px;padding:2px 10px;white-space:nowrap;}
h4.teo-h{font-family:'Source Sans 3',sans-serif;font-size:1rem;font-weight:700;color:var(--terracota);margin:18px 0 6px;}
.teo-table{overflow-x:auto;margin:10px 0 14px;}
.teo-table table.data-table{margin:0;}
.teo-arriba{display:inline-block;margin-top:8px;font-size:.82rem;color:var(--azul);text-decoration:none;}
.teo-arriba:hover{text-decoration:underline;}
.teo-repaso{background:#fff;border:1px solid #e3ddd0;border-top:4px solid var(--terracota);border-radius:6px;padding:6px 20px 12px;margin:34px 0 10px;}
@media (max-width:700px){.teo-indice{columns:1;}}
@media print{
  .teo-bloque{display:none !important;}
  .teo-bloque.print-me{display:block !important;}
  .teo-indice-box,.teo-arriba{display:none !important;}
  .teo-sec{break-inside:auto;}
  .teo-sec-head{break-after:avoid;}
  .teo-ses{background:none;color:#0e9aa7;border:1px solid #0e9aa7;}
}
</style>
</head>
<body>
<header class="top">

<script>
(function () {
  'use strict';
  var PREFIX = 'campana1bach:';

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.className) node.className = opts.className;
    if (opts.text) node.appendChild(document.createTextNode(opts.text));
    if (opts.rich) node.appendChild(rich(opts.rich));
    if (opts.attrs) {
      for (var k in opts.attrs) {
        if (Object.prototype.hasOwnProperty.call(opts.attrs, k)) node.setAttribute(k, opts.attrs[k]);
      }
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }
  function txt(s) { return document.createTextNode(s); }

  /* Marcado mínimo: **negrita** y *cursiva*. Construye nodos, sin innerHTML. */
  function rich(s) {
    var frag = document.createDocumentFragment();
    var re = /\*\*([^*]+)\*\*|\*([^*]+)\*/g;
    var last = 0, m;
    s = String(s);
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) frag.appendChild(txt(s.slice(last, m.index)));
      if (m[1] !== undefined) frag.appendChild(el('strong', { text: m[1] }));
      else frag.appendChild(el('em', { text: m[2] }));
      last = re.lastIndex;
    }
    if (last < s.length) frag.appendChild(txt(s.slice(last)));
    return frag;
  }

  function h2(text) { return el('h2', { className: 'sec-title', text: text }); }
  function h3(text) { return el('h3', { className: 'sub-title', text: text }); }
  function p(text, cls) { return el('p', { className: cls || 'body-text', rich: text }); }
  function ul(items) {
    return el('ul', { className: 'body-list' }, items.map(function (i) { return el('li', { rich: i }); }));
  }
  function ol(items) {
    return el('ol', { className: 'body-list' }, items.map(function (i) { return el('li', { rich: i }); }));
  }
  function callout(label, text, extra) {
    return el('div', { className: 'callout' + (extra ? ' ' + extra : '') }, [
      el('span', { className: 'callout-label', text: label }),
      rich(text)
    ]);
  }
  function concept(term, def) {
    return el('div', { className: 'concept' }, [
      el('span', { className: 'c-term', text: term }),
      el('p', { rich: def })
    ]);
  }
  function table(headers, rows) {
    var thead = el('tr', {}, headers.map(function (h) { return el('th', { text: h }); }));
    var tbody = rows.map(function (r) {
      return el('tr', {}, r.map(function (c) { return el('td', { rich: c }); }));
    });
    return el('table', { className: 'data-table' }, [el('thead', {}, [thead]), el('tbody', {}, tbody)]);
  }
  function frames(items) {
    return el('ul', { className: 'frames' }, items.map(function (i) { return el('li', { rich: i }); }));
  }

  var store = {
    get: function (key) {
      try { return window.localStorage.getItem(PREFIX + key) || ''; } catch (e) { return ''; }
    },
    set: function (key, value) {
      try { window.localStorage.setItem(PREFIX + key, value); } catch (e) { /* sin almacenamiento */ }
    },
    getJSON: function (key, fallback) {
      var raw = store.get(key);
      if (!raw) return fallback;
      try { return JSON.parse(raw); } catch (e) { return fallback; }
    },
    setJSON: function (key, value) { store.set(key, JSON.stringify(value)); }
  };

  function countWords(s) {
    var t = String(s).trim();
    if (!t) return 0;
    return t.split(/\s+/).length;
  }

  /* Área de texto que se guarda sola en el navegador */
  function savedArea(key, placeholder, minHeight, onChange) {
    var ta = el('textarea', { className: 'answer-box', attrs: { placeholder: placeholder || 'Escribe aquí tu respuesta...' } });
    if (minHeight) ta.style.minHeight = minHeight;
    ta.value = store.get(key);
    ta.addEventListener('input', function () {
      store.set(key, ta.value);
      if (onChange) onChange(ta.value);
    });
    return ta;
  }

  function printButton() {
    var b = el('button', { className: 'btn2 print-btn', attrs: { type: 'button' }, text: 'Imprimir esta pestaña' });
    b.addEventListener('click', function () { window.print(); });
    return b;
  }

  function downloadText(filename, content, mime) {
    var blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { attrs: { href: url, download: filename } });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function copyText(content, button) {
    var done = function () {
      var old = button.textContent;
      button.textContent = 'Copiado';
      setTimeout(function () { button.textContent = old; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(content).then(done, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = el('textarea');
      ta.value = content;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* nada */ }
      document.body.removeChild(ta);
    }
  }

  function panel(id) {
    return el('div', { className: 'panel', attrs: { id: 'panel-' + id } });
  }

  window.CAMP = {
    el: el, txt: txt, rich: rich, h2: h2, h3: h3, p: p, ul: ul, ol: ol, callout: callout,
    concept: concept, table: table, frames: frames, store: store, countWords: countWords,
    savedArea: savedArea, printButton: printButton, downloadText: downloadText,
    copyText: copyText, panel: panel, builders: [], goTo: null,
    TABS: [
      { id: 'reto', label: 'El reto' },
      { id: 'teoria', label: 'Teoría' },
      { id: 'sesiones', label: 'Sesiones' },
      { id: 'glosario', label: 'Glosario' },
      { id: 'laboratorio', label: 'Laboratorio de palabras' },
      { id: 'diccionario', label: 'Diccionario de campaña' },
      { id: 'comentario', label: 'Comentario crítico' },
      { id: 'columna', label: 'Taller de columna' },
      { id: 'evaluacion', label: 'Evaluación' }
    ]
  };
})();
(function () {
  'use strict';
  var C = window.CAMP;
  var el = C.el;

  function norm(s, exact) {
    var t = String(s).replace(/\s+/g, ' ').trim();
    if (!exact) t = t.toLowerCase();
    return t;
  }

  /* Ejercicio cerrado: 'select' (desplegable) o 'input' (respuesta breve) */
  function closedExercise(ex, key) {
    var box = el('div', { className: 'ex' });
    box.appendChild(el('h4', { rich: ex.title }));
    if (ex.instr) box.appendChild(el('p', { className: 'instr', rich: ex.instr }));
    var rows = [];
    ex.items.forEach(function (it, i) {
      var k = key + ':' + i;
      var control;
      if (ex.type === 'select') {
        control = el('select', {}, [el('option', { attrs: { value: '' }, text: '— elige —' })].concat(
          (it.options || ex.options).map(function (o) { return el('option', { attrs: { value: o }, text: o }); })
        ));
      } else {
        control = el('input', { attrs: { type: 'text', autocomplete: 'off', spellcheck: 'false', placeholder: it.ph || 'Escribe aquí' } });
      }
      control.value = C.store.get(k);
      var row = el('div', { className: 'ex-item' + (it.stack ? ' stack' : '') }, [
        el('div', { className: 'q', rich: it.q }),
        control
      ]);
      var answers = Array.isArray(it.a) ? it.a : [it.a];
      var solText = '**Solución:** ' + answers[0] + (it.why ? '. ' + it.why : '');
      row.appendChild(el('div', { className: 'sol', rich: solText }));
      control.addEventListener(ex.type === 'select' ? 'change' : 'input', function () {
        C.store.set(k, control.value);
        row.classList.remove('ok', 'ko');
      });
      rows.push({ row: row, control: control, answers: answers });
      box.appendChild(row);
    });
    var score = el('span', { className: 'score' });
    var check = el('button', { className: 'btn2 primary', attrs: { type: 'button' }, text: 'Comprobar' });
    var show = el('button', { className: 'btn2', attrs: { type: 'button' }, text: 'Ver soluciones' });
    var reset = el('button', { className: 'btn2', attrs: { type: 'button' }, text: 'Borrar' });
    check.addEventListener('click', function () {
      var ok = 0;
      rows.forEach(function (r) {
        var v = norm(r.control.value, ex.exact);
        var good = r.answers.some(function (a) { return norm(a, ex.exact) === v; });
        r.row.classList.remove('ok', 'ko');
        if (v) r.row.classList.add(good ? 'ok' : 'ko');
        if (good) ok++;
      });
      score.textContent = ok + ' / ' + rows.length + ' correctas';
    });
    show.addEventListener('click', function () {
      box.classList.toggle('show-sol');
      show.textContent = box.classList.contains('show-sol') ? 'Ocultar soluciones' : 'Ver soluciones';
    });
    reset.addEventListener('click', function () {
      rows.forEach(function (r, i) {
        r.control.value = '';
        r.row.classList.remove('ok', 'ko');
        C.store.set(key + ':' + i, '');
      });
      score.textContent = '';
    });
    box.appendChild(el('div', { className: 'btn-row' }, [check, show, reset, score]));
    return box;
  }

  /* Ejercicio abierto: consignas con área de texto y propuesta de solución */
  function openExercise(ex, key) {
    var box = el('div', { className: 'ex' });
    box.appendChild(el('h4', { rich: ex.title }));
    if (ex.instr) box.appendChild(el('p', { className: 'instr', rich: ex.instr }));
    ex.items.forEach(function (it, i) {
      var wrap = el('div', { className: 'ex-item stack' });
      wrap.appendChild(el('div', { className: 'q', rich: it.q }));
      wrap.appendChild(C.savedArea(key + ':' + i, it.ph || 'Escribe aquí tu respuesta...', it.h || '70px'));
      if (it.model) {
        var model = el('div', { className: 'model' }, [el('span', { className: 'm-label', text: 'Propuesta de respuesta' })]);
        (Array.isArray(it.model) ? it.model : [it.model]).forEach(function (m) { model.appendChild(el('p', { rich: m })); });
        var b = el('button', { className: 'btn2', attrs: { type: 'button' }, text: 'Ver propuesta' });
        b.addEventListener('click', function () {
          model.classList.toggle('visible');
          b.textContent = model.classList.contains('visible') ? 'Ocultar propuesta' : 'Ver propuesta';
        });
        wrap.appendChild(el('div', { className: 'btn-row' }, [b]));
        wrap.appendChild(model);
      }
      box.appendChild(wrap);
    });
    return box;
  }

  function exercise(ex, key) {
    if (ex.type === 'open') return openExercise(ex, key);
    return closedExercise(ex, key);
  }

  C.exercise = exercise;
})();
(function () {
  'use strict';
  var C = window.CAMP;
  var el = C.el, h2 = C.h2, h3 = C.h3, p = C.p, ul = C.ul;

  function link(label, tab) {
    var b = el('button', { className: 'btn2', attrs: { type: 'button' }, text: label });
    b.addEventListener('click', function () { C.goTo(tab); });
    return b;
  }

  function build() {
    var panel = C.panel('reto');
    panel.appendChild(C.printButton());
    panel.appendChild(h2('El reto: leer como una experta'));
    panel.appendChild(p('Estos días recibes titulares, vídeos y mensajes sobre los mismos hechos contados de maneras muy distintas. En esta situación de aprendizaje vas a usar la campaña y los resultados de las elecciones generales del 29 de noviembre como material de trabajo. No vamos a opinar sobre quién debe ganar: vamos a explicar, con precisión técnica, **cómo un texto construye una interpretación de la realidad**.', 'lead'));
    panel.appendChild(p('Al final escribirás tu propia columna de opinión y tendrás que justificar cada decisión lingüística importante. Por el camino, en cada sesión trabajarás el vocabulario y la formación de palabras con el léxico real de la campaña.'));

    panel.appendChild(C.callout('Norma de neutralidad', 'En esta unidad se analiza el lenguaje, nunca la orientación de voto. Los textos procederán de medios de distinta línea editorial y de todas las candidaturas en proporción equilibrada. Ninguna tarea te pide ni valora tu preferencia política. Si en un análisis aparece una opinión, debe referirse al texto y a sus mecanismos, no a los partidos.'));

    panel.appendChild(h3('Qué vas a entregar'));
    var g = el('div', { className: 'grid2' });
    [
      ['Comentario crítico', 'Prueba individual en la sesión 9 sobre una columna o un editorial que no habrás visto antes. 60 minutos. Cuenta un 40 %.'],
      ['Columna de opinión', 'Entre 400 y 500 palabras, con una nota de decisiones lingüísticas de 150 a 200 palabras. Cuenta un 35 %.'],
      ['Diccionario de campaña', 'Al menos 35 entradas al final de la sesión 8, más las preguntas de léxico del comentario. Cuenta un 25 %.']
    ].forEach(function (c) {
      g.appendChild(el('div', { className: 'card' }, [el('h4', { text: c[0] }), el('p', { rich: c[1] })]));
    });
    panel.appendChild(g);

    panel.appendChild(h3('Cómo es cada sesión'));
    panel.appendChild(p('Cada clase tiene dos partes. Primero, **análisis del discurso** (35-40 minutos): textos reales de prensa y redes y herramientas lingüísticas para explicarlos. Después, **laboratorio de palabras** (15-20 minutos): formar, descomponer, sustituir y reescribir palabras de la campaña.'));
    panel.appendChild(p('Todo lo que trabajes en el laboratorio pasa a tu **Diccionario de campaña**: cada sesión añades al menos cinco palabras con su definición, su procedimiento de formación, un ejemplo real y su matiz connotativo.'));

    panel.appendChild(h3('Las tres fases'));
    panel.appendChild(C.table(['Fase', 'Sesiones', 'Qué hacemos'], [
      ['1. Final de campaña', '1-3', 'Agenda, gramática de la objetividad y encuadre, con textos de los últimos días de campaña.'],
      ['2. Resultados y opinión', '4-7', 'Titulares de resultados, géneros de opinión, discurso en redes y desinformación.'],
      ['3. Producción y evaluación', '8-9 (+10)', 'Taller de columna, prueba de comentario y, si se hace, exposición oral.']
    ]));

    panel.appendChild(h3('Herramientas de esta página'));
    panel.appendChild(ul([
      '**Sesiones**: guion de cada clase, conceptos clave y tareas.',
      '**Glosario**: todos los términos de análisis, con buscador.',
      '**Laboratorio de palabras**: nueve fichas con ejercicios autocorregibles y propuestas de solución.',
      '**Diccionario de campaña**: tu plantilla para crear, guardar y descargar las entradas.',
      '**Comentario crítico**: estructura de la prueba, marcos de frase y un comentario modelo.',
      '**Taller de columna**: planificación, borrador con contador de palabras, revisión y nota de decisiones.',
      '**Evaluación**: pesos, rúbricas y criterios.'
    ]));
    panel.appendChild(el('div', { className: 'btn-row' }, [
      link('Ir a las sesiones', 'sesiones'), link('Abrir el Diccionario', 'diccionario'), link('Ver la evaluación', 'evaluacion')
    ]));

    panel.appendChild(C.callout('Dónde se guarda tu trabajo', 'Lo que escribes en esta página se guarda en este navegador y en este dispositivo. Si cambias de ordenador o borras los datos del navegador, se pierde. Descarga o copia tu trabajo con los botones de cada pestaña y entrégalo donde se te indique.', 'warm'));

    document.getElementById('content-root').appendChild(panel);
  }
  C.builders.push(build);
})();
(function () {
  'use strict';
  var C = window.CAMP;
  var el = C.el, h2 = C.h2, h3 = C.h3, p = C.p, ul = C.ul;

  var PHASES = {
    1: 'Fase 1 · Final de campaña',
    2: 'Fase 2 · Resultados y opinión',
    3: 'Fase 3 · Producción y evaluación'
  };

  var S = [
    {
      n: 1, phase: 1, title: 'La agenda: qué es noticia y quién lo decide',

      ],
      exercises: [{

    var body = el('div', { className: 's-body' });
    body.appendChild(p('**Objetivo.** ' + s.goal));
    body.appendChild(el('h4', { className: 'sub-title', text: 'Conceptos clave' }));
    s.concepts.forEach(function (c) { body.appendChild(C.concept(c[0], c[1])); });
    body.appendChild(el('h4', { className: 'sub-title', text: 'En clase' }));
    body.appendChild(C.ol(s.tasks));
    if (s.frames) {
      body.appendChild(p('**Marcos de frase**'));
      body.appendChild(C.frames(s.frames));
    }
    (s.exercises || []).forEach(function (ex, i) {
      body.appendChild(C.exercise(ex, 's' + s.n + 'e' + i));
    });
    var btns = [];
    if (s.lab) {
      var lb = el('button', { className: 'btn2', attrs: { type: 'button' }, text: 'Ficha ' + s.lab + ' del laboratorio' });
      lb.addEventListener('click', function () { C.openLab(s.lab); });
      btns.push(lb);
    }
    if (s.goTab) {
      var gb = el('button', { className: 'btn2', attrs: { type: 'button' }, text: s.goTab[0] });
      gb.addEventListener('click', function () { C.goTo(s.goTab[1]); });
      btns.push(gb);
    }
    if (btns.length) body.appendChild(el('div', { className: 'btn-row' }, btns));
    body.appendChild(el('h4', { className: 'sub-title', text: 'Mis notas de la sesión' }));
    body.appendChild(C.savedArea('notas' + s.n, 'Apuntes, dudas, ejemplos que te han llamado la atención...', '80px'));
    d.appendChild(body);
    return d;
  }

  function sincronizable(key) {

  }

  /* Cada área de texto se registra para poder etiquetarla en la hoja */

    if ((m = /^notas(\d+)$/.exec(key))) return 'Sesión ' + m[1] + ' · Apuntes';
    if ((m = /^coment(\d+)$/.exec(key))) return 'Comentario · Apartado ' + m[1];
    if (/^plan-/.test(key)) {

      return 'Columna · Planificación · ' + (lab ? texto(lab) : key.slice(5));
    }
    var ta = document.querySelector('textarea[data-key="' + key + '"]');
    if (!ta) return key;
    var partes = [];
    var panel = ta.closest('.panel');
    if (panel) {
      var info = C.TABS.filter(function (t) { return 'panel-' + t.id === panel.id; })[0];
      if (info) partes.push(info.label);

    var ex = ta.closest('.ex');

    if (!Array.isArray(lista)) return { texto: '', n: 0 };

  function carga(claves) {

      .then(function (r) { return r.json(); })
      .then(function (res) {
        enviando = false;

      n: 1,
      title: 'Los medios y los géneros periodísticos',
      intro: 'Qué es el periodismo, cómo se organiza un periódico y qué rasgos formales y lingüísticos tiene cada género.',
      secciones: [
        {
          id: 't1-1', title: 'Los medios de comunicación', ses: '1',
          items: [
            'Un **medio de comunicación de masas** es un canal que transmite mensajes a un público amplio, heterogéneo y disperso. Los principales son la **prensa** (en papel y digital), la **radio**, la **televisión** y las **plataformas digitales y redes sociales**.',
            { h: 'Rasgos de la comunicación de masas' },
            { ul: [
              '**Emisor colectivo**: detrás del texto hay una empresa periodística, aunque lo firme una persona.',
              '**Receptor múltiple y anónimo**: el medio no sabe exactamente quién lo lee.',
              '**Comunicación unidireccional**: la respuesta del público es escasa o diferida. Los medios digitales la amplían con comentarios, encuestas y redes.',
              '**Mensaje perecedero**: la noticia de hoy deja de interesar mañana.',
              '**Varios códigos**: palabra, imagen, tipografía, sonido. Por eso hablamos de textos **multimodales**.'
            ] },
            { h: 'Funciones de los medios' },
            { t: ['Función', 'Qué hace', 'Géneros donde predomina'], r: [
              ['**Informar**', 'Da a conocer hechos de actualidad.', 'Noticia, reportaje, entrevista'],
              ['**Formar opinión**', 'Interpreta y valora los hechos.', 'Editorial, columna, artículo, crónica'],
              ['**Entretener**', 'Ofrece ocio y evasión.', 'Pasatiempos, humor gráfico, ciertas secciones'],
              ['**Persuadir (publicidad)**', 'Vende productos o ideas; financia al medio.', 'Anuncios, publicidad institucional, propaganda']
            ] },
            { c: ['Línea editorial', 'Conjunto de valores, ideas y posiciones que orientan a un medio. Se ve abiertamente en los editoriales, pero también en qué noticias elige, cuánto espacio les da y desde qué enfoque las cuenta.'] },
            { k: ['Importante', 'La **objetividad absoluta no existe**: elegir qué se cuenta y en qué orden ya es interpretar. Por eso el periodismo responsable se rige por otros principios: **veracidad**, **contraste de fuentes**, **pluralidad de voces** y **separación entre información y opinión**.'] },
            'Desde el punto de vista textual, los géneros informativos combinan **narración** y **exposición**; los de opinión son esencialmente **argumentativos**; y la entrevista y el reportaje incorporan **diálogo** y **descripción**.'
          ]
        },
        {
          id: 't1-2', title: 'El periódico: secciones y elementos', ses: '1',
          items: [
            { h: 'Las secciones' },
            'El periódico agrupa la información en **secciones** fijas, que el lector reconoce y que expresan una jerarquía.',
            { t: ['Sección', 'Contenido'], r: [
              ['Portada', 'Escaparate del periódico: las noticias más importantes del día y llamadas a páginas interiores.'],
              ['Opinión', 'Editorial, columnas, artículos, cartas al director, viñetas.'],
              ['Nacional / España', 'Política y actualidad del país. En campaña concentra la información electoral.'],
              ['Internacional', 'Noticias de otros países.'],
              ['Local / Regional', 'Actualidad de la comunidad o la ciudad.'],
              ['Economía', 'Empresas, empleo, mercados, impuestos.'],
              ['Sociedad', 'Educación, sanidad, sucesos, ciencia, medio ambiente.'],
              ['Cultura y espectáculos', 'Libros, cine, música, arte, televisión.'],
              ['Deportes', 'Competiciones y deportistas.']
            ] },
            { h: 'La portada y la jerarquía' },
            'La portada no se lee solo de arriba abajo: cada posición tiene un valor. La noticia que **abre** la portada (arriba, con el titular más grande) es la que el medio considera más importante. También cuentan el **número de columnas**, el **tamaño de la foto** y lo que **no aparece**.',
            { h: 'Elementos de una información' },
            { ul: [
              '**Cabecera**: nombre y logotipo del periódico, fecha y número.',
              '**Data**: lugar y fecha desde donde se escribe (*Madrid, 30 de noviembre*).',
              '**Firma**: periodista, corresponsal, enviado especial, agencia (*EFE*, *Europa Press*) o *Redacción*.',
              '**Titulares**: antetítulo, título y subtítulo (ver apartado siguiente).',
              '**Entradilla** o *lead*: primer párrafo, que resume lo esencial.',
              '**Cuerpo**: desarrollo de la información.',
              '**Ladillos**: pequeños títulos intermedios que dividen un texto largo.',
              '**Destacados**: frases del texto resaltadas en mayor tamaño.',
              '**Fotografía y pie de foto**: el pie orienta cómo debemos mirar la imagen.',
              '**Infografía**: gráficos, mapas o esquemas con datos.',
              '**Despiece**: texto breve complementario, separado del principal.'
            ] },
            { h: 'La prensa digital' },
            { ul: [
              '**Hipertextualidad**: enlaces a otras noticias y documentos.',
              '**Multimedialidad**: texto, vídeo, audio, galerías, gráficos interactivos.',
              '**Interactividad**: comentarios, encuestas, botones para compartir.',
              '**Actualización constante**: última hora y directos.',
              '**Dependencia de las métricas**: los clics y el tiempo de lectura influyen en los titulares, a veces pensados más para atraer que para informar (**ciberanzuelo**).'
            ] }
          ]
        },
        {
          id: 't1-3', title: 'El titular', ses: '1 y 4',
          items: [
            'El titular **resume** la información y **atrae** al lector. Muchos lectores solo leen titulares, por eso es el lugar donde más se concentra la intención del medio.',
            { h: 'Partes' },
            { ul: [
              '**Antetítulo** (cintillo): sitúa el tema. *Elecciones generales*.',
              '**Título**: lo esencial, en letra grande. *La participación sube tres puntos*.',
              '**Subtítulo** (sumario): amplía datos. *Las mesas cerraron a las 20.00 con colas en varias ciudades*.'
            ] },
            { h: 'Tipos de titulares' },
            { t: ['Tipo', 'Qué hace', 'Ejemplo (inventado)'], r: [
              ['**Informativo**', 'Enuncia el hecho con sus datos esenciales.', '*El Congreso aprueba la ley de vivienda*'],
              ['**Interpretativo o valorativo**', 'Añade una valoración o una interpretación del hecho.', '*Golpe de efecto del Gobierno con la ley de vivienda*'],
              ['**Expresivo o apelativo**', 'Busca impacto emocional y no informa del todo; supone que el lector ya conoce el hecho.', '*¡Por fin!*'],
              ['**De cita**', 'Reproduce palabras de un protagonista, entre comillas.', '*La portavoz: «No habrá subida de impuestos»*']
            ] },
            { h: 'Rasgos lingüísticos' },
            { ul: [
              '**Brevedad**: oraciones simples o **frases nominales** sin verbo (*Victoria ajustada en las urnas*).',
              '**Presente de indicativo** para hechos ya ocurridos, que los acerca al lector (*El Gobierno aprueba…*).',
              '**Supresión de artículos** y de palabras prescindibles.',
              '**Dos puntos** para atribuir una cita (*La ministra: «…»*).',
              '**Condicional de rumor** para lo no confirmado (*El partido estaría preparando una moción*).',
              'En los titulares valorativos y expresivos: **léxico connotado**, **metáforas** y **juegos de palabras**.'
            ] }
          ]
        },
        {
          id: 't1-4', title: 'Los géneros periodísticos', ses: '1-6',
          items: [
            'Los **géneros periodísticos** son modelos de texto que se repiten y que el lector reconoce. Se clasifican según su **intención**: informar, opinar o hacer las dos cosas a la vez.',
            { t: ['Grupo', 'Intención', 'Géneros', 'Firma'], r: [
              ['**Informativos**', 'Contar hechos con objetividad.', 'Noticia, reportaje informativo, entrevista informativa', 'Normalmente sí (o agencia)'],
              ['**Interpretativos o híbridos**', 'Informar y, a la vez, interpretar y valorar.', 'Crónica, reportaje interpretativo, entrevista de personalidad', 'Sí'],
              ['**De opinión**', 'Expresar y argumentar una valoración.', 'Editorial, artículo de opinión, columna, crítica, cartas al director, viñeta', 'Sí, salvo el editorial']
            ] },
            { k: ['Ojo', 'Las fronteras entre géneros no son rígidas y los manuales no siempre coinciden en la clasificación. En el comentario no basta con nombrar el género: hay que **justificarlo** con los rasgos del texto (firma, estructura, presencia del autor, intención).'] }
          ]
        },
        {
          id: 't1-5', title: 'La noticia', ses: '1, 2 y 4',
          items: [
            { c: ['Noticia', 'Relato breve, veraz y objetivo de un hecho de actualidad que interesa a un público amplio.'] },
            { h: 'Qué convierte un hecho en noticia' },
            'Los **criterios de noticiabilidad** (valores-noticia) son: **actualidad**, **novedad o rareza**, **proximidad** geográfica o afectiva, **relevancia** o consecuencias, **notoriedad** de los protagonistas, **conflicto** e **interés humano**. La frase clásica lo resume: que un perro muerda a un hombre no es noticia; que un hombre muerda a un perro, sí.',
            { h: 'Las seis preguntas' },
            'Una noticia completa responde a **qué**, **quién**, **cuándo**, **dónde**, **cómo** y **por qué** (en inglés, las 6 W). A veces se añade **para qué**.',
            { h: 'Estructura de pirámide invertida' },
            'La información se ordena de **más a menos importante**:',
            { ol: [
              '**Titular**: lo esencial en pocas palabras.',
              '**Entradilla**: el primer párrafo responde a las preguntas principales. A menudo va en negrita.',
              '**Cuerpo**: datos secundarios, antecedentes, contexto, declaraciones y reacciones, en orden decreciente de interés.'
            ] },
            'Así, el lector que solo lee el principio conoce lo esencial, y el texto puede recortarse por el final sin perder sentido.',
            { h: 'Rasgos lingüísticos' },
            { ul: [
              '**Tercera persona** y ausencia de marcas del periodista.',
              '**Modalidad enunciativa**: oraciones declarativas.',
              '**Léxico denotativo y preciso**; tecnicismos (explicados si es necesario); siglas.',
              '**Adjetivos especificativos y relacionales**, normalmente pospuestos: *campaña electoral*, *sede central*.',
              '**Tiempos verbales**: pretérito perfecto simple y compuesto para los hechos (*votaron, ha ganado*); presente para la actualidad.',
              '**Condicional de rumor** para lo no confirmado: *el candidato habría aceptado*.',
              '**Estilo directo e indirecto** con verbos de habla, y **atribución de fuentes**.',
              '**Datos precisos**: cifras, fechas, lugares, nombres.',
              '**Construcciones impersonales y pasivas** y **nominalizaciones**, que dan apariencia de objetividad (ver bloque 2).'
            ] },
            { ej: 'Entradilla inventada: *Las mesas electorales cerraron ayer a las 20.00 con una participación del 71 %, tres puntos más que en las anteriores generales, según los datos del Ministerio del Interior.* Responde a qué (cierre y participación), cuándo (ayer, 20.00), cuánto (71 %) y fuente (Ministerio del Interior).' }
          ]
        },
        {
          id: 't1-6', title: 'El reportaje y la entrevista', ses: '1-3',
          items: [
            { h: 'El reportaje' },
            { c: ['Reportaje', 'Texto informativo extenso que **profundiza** en un tema de interés, no necesariamente de actualidad inmediata, con documentación, datos, testimonios e imágenes.'] },
            { ul: [
              'Va **firmado** y suele ocupar varias páginas, con fotografías, infografías y despieces.',
              'Tiene **libertad estructural**: puede empezar con una anécdota, una escena o una cita llamativa para atrapar al lector.',
              'Combina **narración, descripción, exposición y diálogo** (los testimonios).',
              'Tipos: **informativo**, **interpretativo** (el periodista explica causas y consecuencias) y **de investigación** (saca a la luz hechos ocultos).'
            ] },
            { h: 'La entrevista' },
            { c: ['Entrevista', 'Texto que reproduce el diálogo entre un periodista y una persona de interés.'] },
            { t: ['Tipo', 'Qué interesa', 'Forma'], r: [
              ['**Informativa** (de declaraciones)', 'Lo que dice el entrevistado sobre un tema.', 'Pregunta-respuesta en estilo directo.'],
              ['**De personalidad** (perfil)', 'La persona: su carácter, su trayectoria, sus gustos.', 'Mezcla diálogo, descripción y comentarios del periodista.']
            ] },
            { ul: [
              'Estructura: **titular** (a menudo una frase del entrevistado), **entradilla** que presenta al personaje, **cuerpo** de preguntas y respuestas y, a veces, un **cierre**.',
              'Rasgos: **modalidad interrogativa**, **deixis de primera y segunda persona**, marcas de **oralidad** y registro propio del entrevistado.'
            ] }
          ]
        },
        {
          id: 't1-7', title: 'La crónica', ses: '2',
          items: [
            { c: ['Crónica', 'Relato de hechos de actualidad escrito por un periodista que ha estado presente o que sigue el tema de forma continuada. **Informa e interpreta a la vez**.'] },
            { ul: [
              'Va **firmada** y lleva **data** (lugar desde el que se escribe).',
              'La escribe un **cronista**, un **corresponsal** (residente en el lugar) o un **enviado especial**.',
              'Tipos según el tema: **política** (un mitin, un debate), **parlamentaria**, **deportiva**, **de sucesos**, **cultural**, **de guerra**.',
              'Suele seguir un **orden cronológico** y puede terminar con una **valoración**.'
            ] },
            { h: 'Rasgos lingüísticos' },
            { ul: [
              '**Narración**: verbos en pasado o **presente histórico**, marcadores temporales.',
              '**Descripción**: detalles del ambiente, gestos, adjetivación abundante.',
              '**Estilo personal** y a veces literario: metáforas, ironía, comparaciones.',
              '**Subjetividad moderada**: adjetivos valorativos, comentarios del autor, a veces primera persona.'
            ] },
            { k: ['Noticia o crónica', 'Ante un mismo mitin, la **noticia** dice qué se dijo y cuántos asistieron; la **crónica** cuenta además cómo fue el ambiente, qué gestos hubo y qué significado tiene el acto. La presencia del periodista es la diferencia clave.'] }
          ]
        },
        {
          id: 't1-8', title: 'Los géneros de opinión', ses: '5, 8 y 9',
          items: [
            'Todos tienen **intención argumentativa**: defienden una **tesis**. Comparten los rasgos de la **subjetividad** (bloque 2) y de la **argumentación** (bloque 3).',
            { h: 'El editorial' },
            { ul: [
              '**Sin firma**: expresa la opinión **del periódico**, su línea editorial.',
              'Trata los temas de actualidad **más relevantes** y aparece en un lugar fijo de las páginas de opinión.',
              'Estructura argumentativa clara: **presentación del hecho**, **tesis**, **argumentos**, **conclusión**, a menudo con una **exigencia** o propuesta.',
              '**Tono institucional** y registro culto; **primera persona del plural** (*creemos, este periódico*) o construcciones impersonales.',
              '**Modalidad deóntica** (obligación): *el Gobierno debe…, es imprescindible que…, resulta inadmisible…*'
            ] },
            { h: 'El artículo de opinión' },
            { ul: [
              'Firmado por un **autor ocasional**, a menudo experto en el tema o figura pública.',
              'Argumentación **documentada**, a veces con datos y citas.',
              'Su autoridad procede del prestigio o la especialidad de quien firma.'
            ] },
            { h: 'La columna' },
            { ul: [
              'Firmada por un **colaborador habitual** (columnista), con **periodicidad y espacio fijos**; a veces con título de sección propio.',
              '**Tema libre** y **estilo personal**: ironía, humor, anécdotas, primera persona, metáforas, registro que puede llegar a lo coloquial.',
              '**Brevedad**. La tesis puede quedar **implícita**.',
              'Es el género más cercano al **ensayo** y a la literatura. Es el que escribirás en la sesión 8.'
            ] },
            { t: ['', 'Editorial', 'Artículo de opinión', 'Columna'], r: [
              ['Firma', 'No', 'Sí, autor ocasional', 'Sí, colaborador fijo'],
              ['Voz', 'La del medio', 'La del autor', 'La del autor'],
              ['Periodicidad', 'Diaria', 'Ocasional', 'Fija (diaria, semanal)'],
              ['Tema', 'Actualidad relevante', 'Especialidad del autor', 'Libre'],
              ['Estilo', 'Institucional, formal', 'Culto, documentado', 'Personal, literario, irónico']
            ] },
            { h: 'Otros géneros de opinión' },
            { ul: [
              '**Crítica o reseña**: un especialista informa sobre una obra (libro, película, concierto) y la valora.',
              '**Cartas al director**: textos breves de los lectores. Es el espacio de participación del público.',
              '**Viñeta y tira cómica**: opinión mediante humor gráfico, con caricatura e ironía; combina imagen y texto.'
            ] }
          ]
        },
        {
          id: 't1-9', title: 'Medios, política y opinión pública', ses: '1, 3 y 6',
          items: [
            { c: ['Agenda (agenda-setting)', 'Teoría formulada por McCombs y Shaw en 1972, a partir de una idea de Bernard Cohen: los medios no nos dicen **qué pensar**, pero sí **sobre qué pensar**. Al elegir los temas y el espacio que les dan, fijan la lista de asuntos que parecen importantes.'] },
            { c: ['Encuadre (framing)', 'Seleccionar unos aspectos de la realidad y hacerlos más visibles que otros, de modo que se favorece una definición del problema, una explicación de sus causas, un juicio moral y una solución. Encuadres frecuentes: **económico**, **de conflicto**, **de interés humano**, **de responsabilidad**, **moral** y, en campaña, **de estrategia** (quién gana o pierde votos).'] },
            { c: ['Discurso político', 'Discurso cuya finalidad es **persuadir** para obtener o conservar apoyo. Géneros: mitin, debate, eslogan, programa electoral, entrevista, publicación en redes. Es distinto de la información periodística, aunque los medios lo reproducen y lo comentan.'] },
            { c: ['Eslogan', 'Frase breve y memorable que condensa un mensaje. Recursos habituales: elipsis del verbo, imperativo o primera persona del plural, antítesis, paralelismo, aliteración, juegos de palabras.'] },
            { c: ['Polarización', 'División del discurso en dos bandos enfrentados, **nosotros** (los buenos, la gente) frente a **ellos** (los otros, el peligro). Se construye con la deixis personal y el léxico valorativo.'] },
            { c: ['Burbuja de filtros y cámara de eco', 'Los algoritmos de las redes nos muestran sobre todo contenidos parecidos a los que ya consumimos. El resultado es un entorno en el que solo escuchamos opiniones afines y las contrarias parecen raras o absurdas.'] },
            { c: ['Viralidad', 'Difusión muy rápida de un contenido de usuario a usuario. Se favorece con brevedad, impacto visual y emociones intensas (indignación, miedo, humor).'] }
          ]
        },
        {
          id: 't1-10', title: 'Desinformación y verificación', ses: '7',
          items: [
            { c: ['Desinformación', 'Información falsa o engañosa que se difunde **a propósito**. Es distinta del error periodístico, que no es intencionado y se corrige.'] },
            { c: ['Bulo', 'Noticia falsa difundida deliberadamente, normalmente para engañar o perjudicar. Es la palabra española preferible a *fake news*.'] },
            { c: ['Posverdad', 'Según el DLE, distorsión deliberada de una realidad que manipula creencias y emociones para influir en la opinión pública. Lo que importa no es si algo es verdad, sino si encaja con lo que ya sentimos.'] },
            { h: 'Tipos de desinformación' },
            'La clasificación más usada (de Claire Wardle, First Draft) distingue siete tipos, de menor a mayor intención de engañar:',
            { t: ['Tipo', 'En qué consiste'], r: [
              ['**Sátira o parodia**', 'Humor que se toma como real al perder su contexto.'],
              ['**Conexión falsa**', 'El titular, la imagen o el pie no corresponden al contenido.'],
              ['**Contenido engañoso**', 'Datos reales usados para dar una impresión falsa.'],
              ['**Contexto falso**', 'Contenido real presentado fuera de su fecha o su lugar.'],
              ['**Suplantación**', 'Se imita a un medio, una institución o una persona.'],
              ['**Contenido manipulado**', 'Imagen, vídeo o documento reales, pero alterados.'],
              ['**Contenido inventado**', 'Totalmente falso. Incluye los **ultrafalsos** (*deepfakes*): vídeos o audios generados con inteligencia artificial.']
            ] },
            { h: 'Cómo verificar' },
            { ol: [
              '**Desconfía de lo que te provoca una emoción fuerte** inmediata: es el primer síntoma.',
              '**Lectura lateral**: sal de la página y busca quién la publica, qué dicen otros medios y si hay una fuente original.',
              '**Comprueba la fecha, el autor y la dirección web** (las suplantaciones imitan nombres de medios).',
              '**Búsqueda inversa de imágenes** para saber de dónde y de cuándo procede una foto.',
              '**Consulta a los verificadores**: Maldita.es, Newtral y EFE Verifica publican desmentidos con pruebas.'
            ] }
          ]
        }
      ],
      repaso: [
        '¿Qué diferencia hay entre informar y formar opinión? Pon un género de cada tipo.',
        '¿Qué es la línea editorial y en qué se nota, además de en los editoriales?',
        'Explica la pirámide invertida y por qué es útil para el lector y para el periódico.',
        'Diferencia noticia, crónica y reportaje con tres rasgos.',
        'Compara editorial, artículo de opinión y columna.',
        '¿Qué afirma la teoría de la agenda? ¿Y qué es el encuadre?',
        'Explica tres tipos de desinformación con un ejemplo inventado de cada uno.'
      ]
    },

    {
      n: 2,
      title: 'Objetividad y subjetividad',
      intro: 'Las marcas lingüísticas que hacen que un texto parezca neutral o que dejan ver la opinión de quien escribe.',
      secciones: [
        {
          id: 't2-1', title: 'Conceptos básicos', ses: '2',
          items: [
            { c: ['Objetividad', 'El emisor **se oculta** y presenta los hechos como comprobables, sin valorarlos.'] },
            { c: ['Subjetividad', 'El emisor **se manifiesta** en el texto: opina, valora, siente, duda, exige.'] },
            { c: ['Modalización', 'Conjunto de recursos con los que el emisor muestra su **actitud** ante lo que dice: certeza, duda, deseo, obligación, aprobación o rechazo.'] },
            { c: ['Hecho y opinión', 'Un **hecho** se puede comprobar (*La participación fue del 71 %*). Una **opinión** se puede compartir o rechazar, pero no comprobar (*La participación fue decepcionante*).'] },
            { k: ['Clave para el comentario', 'Ningún texto es totalmente objetivo. Lo que analizamos es **el grado de subjetividad** y **cómo se construye**: con qué palabras, qué estructuras gramaticales y qué recursos. Y siempre hay que relacionarlo con la **intención** del texto.'] }
          ]
        },
        {
          id: 't2-2', title: 'Marcas de objetividad', ses: '2',
          items: [
            { t: ['Recurso', 'Ejemplo'], r: [
              ['**Tercera persona**; el emisor no aparece', '*La candidata presentó su programa en Sevilla.*'],
              ['**Modalidad enunciativa** (oraciones declarativas)', '*El escrutinio terminó a medianoche.*'],
              ['**Léxico denotativo**, preciso y técnico', '*escaño, escrutinio, circunscripción, censo*'],
              ['**Adjetivos especificativos y relacionales**, pospuestos', '*jornada electoral, voto anticipado, ley orgánica*'],
              ['**Modo indicativo** y tiempos de pasado o presente actual', '*votaron, ha ganado, cierra*'],
              ['**Construcciones impersonales y pasivas**', '*Se contabilizaron dos millones de votos. Los resultados fueron publicados a las 23.00.*'],
              ['**Nominalización**', '*La aprobación de la ley…*'],
              ['**Datos y cifras**', '*71 %, 350 escaños, 37 millones de electores*'],
              ['**Fuentes identificadas** y **citas literales**', '*según el Ministerio del Interior; «Respetaremos el resultado», declaró la portavoz.*']
            ] },

            { c: ['Denotación', 'Significado **básico, objetivo y estable** de una palabra, el que recoge el diccionario y comparten todos los hablantes.'] },
            { c: ['Connotación', 'Significados **añadidos**, subjetivos o emocionales, que una palabra evoca según el contexto, la cultura o el hablante. Puede ser **positiva** (meliorativa) o **negativa** (peyorativa).'] },
            { ej: '*Dirigente, líder, cabecilla* y *caudillo* designan a quien manda en un grupo (misma denotación), pero *líder* suele ser positivo, *dirigente* neutro, y *cabecilla* y *caudillo* negativos (connotaciones distintas).' },
            'Las connotaciones pueden ser **colectivas** (compartidas por una comunidad: *burócrata* sugiere lentitud y papeleo) o **individuales** (asociaciones personales). En el comentario interesan las colectivas, porque son las que el autor utiliza para influir.'

            { c: ['Campo semántico (o léxico)', 'Conjunto de palabras de la **misma categoría gramatical** que comparten un rasgo de significado común (sema) y se diferencian por otros. Es un conjunto **cerrado y objetivo**.'] },
            { ej: 'Campo semántico de los **cargos de representación**: *alcalde, concejal, diputado, senador, presidente, ministro*. Todos son sustantivos y comparten el rasgo «cargo público»; se distinguen por el ámbito (municipal, nacional) y la institución (Congreso, Senado, Gobierno).' },

            { ej: 'Campo asociativo de **elecciones**: *urna, papeleta, sobre, colegio electoral, votar, escrutinio, campaña, mitin, candidata, encuesta, abstención, jornada de reflexión, escaño, ganar*.' },
            { t: ['', 'Familia léxica', 'Campo semántico', 'Campo asociativo'], r: [

        {

            { c: ['Sinonimia', 'Relación entre palabras con significado igual o muy parecido. La sinonimia **total** es rara: casi siempre hay diferencias de **registro** (*morir / fallecer / palmar*), de **intensidad** (*subir / dispararse*) o de **connotación** (*líder / cabecilla*). Por eso hablamos de **sinonimia contextual**: dos palabras son sinónimas en un contexto concreto.'] },
            { c: ['Antonimia', 'Relación entre palabras de significado opuesto. **Graduales** (admiten términos intermedios: *alto / bajo, subida / bajada*), **complementarios** (uno excluye al otro: *legal / ilegal, presente / ausente*) y **recíprocos** (uno implica el otro: *comprar / vender, dar / recibir*).'] },

            { ul: [
              '**Históricas**: cambia la realidad, se mantiene la palabra (*pluma* ya no es de ave; *coche* ya no tira de él un caballo).',
              '**Sociales**: una palabra pasa de un ámbito especializado al general o a otro ámbito (*escenario*, del teatro a la política: *el escenario electoral*).',
              '**Psicológicas**: el **tabú** lleva a sustituir palabras por **eufemismos**.',
              '**Lingüísticas**: la **elipsis** (*el móvil* por *el teléfono móvil*).'
            ] },
            { h: 'Mecanismos' },
            { ul: [
              '**Metáfora**: se nombra algo por su semejanza con otra cosa (*cabeza de lista*, *halcones y palomas* para duros y moderados).',
              '**Metonimia**: se nombra algo por otra cosa con la que tiene una relación de proximidad (*la Moncloa* por el Gobierno; *Bruselas* por la Unión Europea; *el banquillo* por los suplentes).',
              '**Ampliación y restricción** del significado.',
              '**Peyoración**: la palabra empeora (*villano*, habitante de una villa, pasó a significar ‘persona ruin’).',
              '**Mejora** o melioración: la palabra mejora (*ministro* procede del latín *minister*, ‘servidor’).'
            ] }
          ]
        },
        {
          id: 't5-6', title: 'Tabú, eufemismo y disfemismo', ses: '3',
          items: [
            { c: ['Tabú', 'Realidades de las que se evita hablar directamente por miedo, pudor o interés: la muerte, la enfermedad, el sexo, el dinero, los despidos, la guerra, los recortes.'] },
            { c: ['Eufemismo', 'Palabra o expresión que **suaviza** una realidad desagradable. En política sirve para **minimizar** o **ocultar**: *reajuste de plantilla* (despidos), *crecimiento negativo* (caída), *desaceleración* (crisis), *daños colaterales* (víctimas civiles), *copago* (pago).'] },
            { c: ['Disfemismo', 'Palabra o expresión que presenta la realidad de forma **más dura, despectiva o ridícula**. Sirve para **atacar**: *tijeretazo* (recorte), *chiringuito* (organismo público), *sablazo fiscal* (impuesto).'] },
            { h: 'La escalera léxica' },
            'Muchas realidades pueden nombrarse con una serie de palabras ordenadas de la más eufemística a la más disfemística:',
            { t: ['Eufemismo', 'Neutro', 'Valorativo', 'Disfemismo'], r: [
              ['*ajuste*', '*reducción*', '*recorte*', '*tijeretazo*'],
              ['*contribución*', '*impuesto*', '*carga fiscal*', '*sablazo*'],
              ['*desaceleración*', '*caída*', '*crisis*', '*hundimiento*']
            ] },
            { k: ['Para el comentario', 'Cuando encuentres un eufemismo o un disfemismo, explica **qué realidad nombra**, **qué palabra neutra se podría haber usado** y **qué efecto busca** el autor con su elección.'] }
          ]
        },
        {
          id: 't5-7', title: 'Diccionarios y obras de consulta', ses: '1-9',
          items: [
            { t: ['Obra', 'Para qué sirve'], r: [
              ['**Diccionario de la lengua española** (DLE, RAE): dle.rae.es', 'Significados de las palabras y sus acepciones, etimología, categoría gramatical y **marcas de uso**: *coloq.* (coloquial), *despect.* (despectivo), *p. us.* (poco usado), *desus.* (desusado), *fig.* (figurado).'],
              ['**Diccionario panhispánico de dudas** (DPD, RAE)', 'Dudas de ortografía, gramática y léxico: si una palabra es correcta, cómo se escribe, cómo se construye.'],
              ['**Fundéu** (Fundación del Español Urgente): fundeu.es', 'Recomendaciones sobre el español de los medios, alternativas a extranjerismos, palabras de actualidad.'],
              ['**Ortografía de la lengua española** (RAE, 2010)', 'Normas ortográficas: prefijos, siglas, mayúsculas, extranjerismos.'],
              ['**Diccionarios de sinónimos y antónimos**', 'Ampliar vocabulario y evitar repeticiones. Comprueba siempre que el sinónimo funciona en tu frase.']
            ] },
            { k: ['Cómo leer una entrada del DLE', 'Tras la palabra aparece la **etimología** entre corchetes; después, las **acepciones** numeradas, cada una con su **categoría** (*m.* masculino, *adj.* adjetivo, *tr.* transitivo) y, si la tiene, su **marca de uso**. Al final pueden aparecer las **locuciones y expresiones** con esa palabra.'] }
          ]
        }
      ],
      repaso: [
        'Explica la diferencia entre denotación y connotación con un ejemplo de la campaña.',
        'Escribe la familia léxica de *gobernar* (al menos ocho palabras).',
        'Diferencia campo semántico y campo asociativo con un ejemplo de cada uno.',
        'Pon un ejemplo de antónimos graduales, complementarios y recíprocos.',
        '¿Qué diferencia hay entre polisemia y homonimia?',
        'Explica dos metonimias habituales en la prensa política.',
        'Construye una escalera léxica con cuatro palabras, del eufemismo al disfemismo.'
      ]
    }
  ];

  /* ---------- Construcción ---------- */

  function render(item) {
    if (typeof item === 'string') return C.p(item);
    if (item.h) return el('h4', { className: 'teo-h', text: item.h });
    if (item.ul) return C.ul(item.ul);
    if (item.ol) return C.ol(item.ol);
    if (item.c) return C.concept(item.c[0], item.c[1]);
    if (item.k) return C.callout(item.k[0], item.k[1]);
    if (item.ej) return C.callout('Ejemplo', item.ej, 'warm');
    if (item.t) {
      var tbl = C.table(item.t, item.r);
      return el('div', { className: 'teo-table' }, [tbl]);
    }
    return null;
  }

  var nodos = [];
  var botones = [];

  function mostrar(n, idSeccion) {
    nodos.forEach(function (node, i) {
      var on = (i + 1) === n;
      node.style.display = on ? '' : 'none';
      node.classList.toggle('print-me', on);
      botones[i].classList.toggle('active', on);
    });
    C.store.set('teoria-bloque', String(n));
    if (idSeccion) {
      var destino = document.getElementById(idSeccion);
      if (destino) destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function bloque(B) {
    var box = el('div', { className: 'teo-bloque' });
    box.appendChild(el('h3', { className: 'sub-title', text: 'Bloque ' + B.n + ' · ' + B.title }));
    box.appendChild(C.p(B.intro));

    var indice = el('ol', { className: 'teo-indice' });
    B.secciones.forEach(function (S, i) {
      var a = el('a', { attrs: { href: '#' + S.id }, text: B.n + '.' + (i + 1) + '. ' + S.title });
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var destino = document.getElementById(S.id);
        if (destino) destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      indice.appendChild(el('li', {}, [a]));
    });
    box.appendChild(el('div', { className: 'teo-indice-box' }, [el('span', { className: 'teo-indice-label', text: 'En este bloque' }), indice]));

    B.secciones.forEach(function (S, i) {
      var sec = el('section', { className: 'teo-sec', attrs: { id: S.id } });
      var cab = el('div', { className: 'teo-sec-head' }, [
        el('h3', { className: 'teo-sec-title', text: B.n + '.' + (i + 1) + '. ' + S.title }),
        el('span', { className: 'teo-ses', text: (/^\d+$/.test(S.ses) ? 'Sesión ' : 'Sesiones ') + S.ses })
      ]);
      sec.appendChild(cab);
      S.items.forEach(function (it) {
        var node = render(it);
        if (node) sec.appendChild(node);
      });
      var arriba = el('a', { className: 'teo-arriba', attrs: { href: '#' }, text: 'Volver al índice del bloque' });
      arriba.addEventListener('click', function (e) {
        e.preventDefault();
        box.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      sec.appendChild(arriba);
      box.appendChild(sec);
    });

    var rep = el('div', { className: 'teo-repaso' }, [
      el('h4', { className: 'teo-h', text: 'Preguntas de repaso' }),
      C.p('Si sabes contestarlas sin mirar, dominas el bloque.'),
      C.ol(B.repaso)
    ]);
    box.appendChild(rep);
    return box;
  }

  function build() {
    var panel = C.panel('teoria');
    panel.appendChild(C.printButton());
    panel.appendChild(C.h2('Teoría'));
    panel.appendChild(C.p('Todo lo que necesitas saber para esta unidad, organizado en cinco bloques. Úsalo para **consultar** mientras trabajas en las sesiones y para **estudiar** antes de la prueba. Junto a cada apartado se indican las sesiones en las que se usa. La impresora saca solo el bloque que tengas abierto.'));

    var picker = el('div', { className: 'lab-picker teo-picker' });
    BLOQUES.forEach(function (B) {
      var b = el('button', { attrs: { type: 'button' } }, [el('b', { text: String(B.n) }), B.title]);
      b.addEventListener('click', function () { mostrar(B.n); });
      botones.push(b);
      picker.appendChild(b);
    });
    panel.appendChild(picker);

    BLOQUES.forEach(function (B) {
      var node = bloque(B);
      nodos.push(node);
      panel.appendChild(node);
    });

    document.getElementById('content-root').appendChild(panel);
    var guardado = parseInt(C.store.get('teoria-bloque'), 10);
    mostrar(guardado >= 1 && guardado <= BLOQUES.length ? guardado : 1);
  }

  C.openTeoria = function (n, idSeccion) {
    C.goTo('teoria');
    mostrar(n, idSeccion);
  };
  C.builders.push(build);
})();

(function () {
  'use strict';
  var C = window.CAMP;

  function init() {
    var tabsNav = document.getElementById('tabs-nav');
    var crumb = document.getElementById('mininav-crumb');
    var counter = document.getElementById('mininav-counter');

    C.builders.forEach(function (fn) { fn(); });

    C.TABS.forEach(function (t) {
      var btn = document.createElement('button');
      btn.className = 'tab';
      btn.type = 'button';
      btn.setAttribute('data-tab', t.id);
      btn.appendChild(document.createTextNode(t.label));
      btn.addEventListener('click', function () { activate(t.id); });
      tabsNav.appendChild(btn);
    });

    function activate(id) {
      var panels = document.querySelectorAll('.panel');
      for (var i = 0; i < panels.length; i++) panels[i].classList.remove('active');
      var target = document.getElementById('panel-' + id);
      if (target) target.classList.add('active');
      var buttons = tabsNav.querySelectorAll('.tab');
      for (var j = 0; j < buttons.length; j++) buttons[j].classList.remove('active');
      var activeBtn = tabsNav.querySelector('[data-tab="' + id + '"]');
      if (activeBtn) activeBtn.classList.add('active');
      var info = C.TABS.filter(function (t) { return t.id === id; })[0];
      if (info) {
        crumb.textContent = '';
        var b = document.createElement('b');
        b.appendChild(document.createTextNode(info.label));
        crumb.appendChild(document.createTextNode('La palabra en campaña — '));
        crumb.appendChild(b);
      }
      var pos = C.TABS.findIndex(function (t) { return t.id === id; }) + 1;
      counter.textContent = pos + ' / ' + C.TABS.length;
      C.store.set('tab-actual', id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    C.goTo = activate;

    /* Al imprimir, se abren todos los desplegables */
    var reopened = [];
    window.addEventListener('beforeprint', function () {
      reopened = [];
      var ds = document.querySelectorAll('.panel.active details');
      for (var i = 0; i < ds.length; i++) {
        if (!ds[i].open) { ds[i].open = true; reopened.push(ds[i]); }
      }
    });
    window.addEventListener('afterprint', function () {
      reopened.forEach(function (d) { d.open = false; });
      reopened = [];
    });

    var saved = C.store.get('tab-actual');
    var valid = C.TABS.some(function (t) { return t.id === saved; });
    activate(valid ? saved : C.TABS[0].id);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
