<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Celestina — 1º de Bachillerato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1a4a7a;
  --azul-osc:#0f2f4d;
  --turquesa:#0e9aa7;
  --terracota:#c64829;
  --oro:#c9973a;
  --crema:#faf7f1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--crema);
  font-family:'Source Sans 3', Arial, sans-serif;
  color:#2a2a28;
  line-height:1.6;
}
h1,h2,h3,h4{
  font-family:'Playfair Display', Georgia, serif;
  color:var(--azul-osc);
  font-weight:700;
  margin-top:0;
}
a{color:var(--terracota);}

header.top{
  background:var(--azul);
  color:#fff;
  padding:22px 24px 0 24px;
}
.top-inner{
  max-width:980px;
  margin:0 auto;
}
.eyebrow{
  font-family:'Source Sans 3', sans-serif;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:.78rem;
  color:#a9d9dc;
  margin:0 0 6px 0;
}
h1.title{
  font-size:1.9rem;
  color:#fff;
  margin:0 0 4px 0;
}
p.subtitle{
  margin:0 0 18px 0;
  color:rgba(255,255,255,.8);
  font-size:1rem;
  max-width:640px;
}

nav.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:2px;
  border-top:1px solid rgba(255,255,255,.15);
  padding-top:2px;
}
button.tab{
  appearance:none;
  border:none;
  background:transparent;
  color:rgba(255,255,255,.55);
  font-family:'Source Sans 3', sans-serif;
  font-size:.85rem;
  font-weight:600;
  padding:11px 14px 10px 14px;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:color .15s ease;
  white-space:nowrap;
}
button.tab:hover{color:rgba(255,255,255,.85);}
button.tab.active{
  color:#fff;
  border-bottom:3px solid var(--terracota);
}

div.mininav{
  background:var(--azul-osc);
  color:rgba(255,255,255,.85);
  font-size:.82rem;
  padding:9px 24px;
}
div.mininav .mininav-inner{
  max-width:980px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
div.mininav .crumb b{color:var(--oro);}
div.mininav .counter{color:rgba(255,255,255,.6);}

main{
  max-width:980px;
  margin:0 auto;
  padding:32px 24px 80px 24px;
}
.panel{display:none;}
.panel.active{display:block;}

h2.sec-title{
  font-size:1.45rem;
  border-bottom:2px solid var(--oro);
  padding-bottom:8px;
  margin:0 0 18px 0;
}
h2.sec-title:not(:first-child){margin-top:38px;}
h3.sub-title{
  font-size:1.12rem;
  color:var(--terracota);
  margin:22px 0 8px 0;
}
p.body-text{margin:0 0 12px 0;}
ul.body-list{margin:0 0 16px 0;padding-left:22px;}
ul.body-list li{margin-bottom:6px;}

.callout{
  background:var(--turquesa);
  color:#fff;
  border-radius:6px;
  padding:14px 18px;
  margin:18px 0;
  font-size:.95rem;
}
.callout .callout-label{
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:.72rem;
  display:block;
  margin-bottom:6px;
  color:#eafcfd;
}

.frag{
  background:#fff;
  border-left:4px solid var(--oro);
  border-radius:0 6px 6px 0;
  padding:16px 20px;
  margin:16px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.frag .frag-source{
  font-size:.78rem;
  color:#7a7a76;
  margin-top:10px;
  font-style:italic;
}
.frag p.dline{margin:0 0 6px 0;font-size:.96rem;}
.frag p.dline b{color:var(--azul-osc);}
.frag p.narr{margin:0 0 6px 0;font-size:.96rem;font-style:italic;}

table.data-table{
  border-collapse:collapse;
  width:100%;
  margin:14px 0 20px 0;
  font-size:.92rem;
}
table.data-table th{
  background:var(--azul-osc);
  color:#fff;
  text-align:left;
  padding:8px 10px;
}
table.data-table td{
  padding:8px 10px;
  border-bottom:1px solid #e3ddd0;
  vertical-align:top;
}
table.data-table tr:nth-child(even) td{background:#f3efe4;}

.qbox{
  border-left:4px solid var(--terracota);
  padding:6px 0 6px 16px;
  margin:16px 0;
  font-style:italic;
  color:#3a3a36;
}

.activity{
  background:#fff;
  border:1px solid #e3ddd0;
  border-radius:6px;
  padding:16px 20px;
  margin:18px 0;
}
.activity h4{
  color:var(--azul);
  margin:0 0 4px 0;
  font-family:'Source Sans 3', sans-serif;
  font-weight:700;
  font-size:.95rem;
}
.activity .level-tag{
  display:inline-block;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-weight:700;
  color:#fff;
  background:var(--oro);
  border-radius:3px;
  padding:2px 7px;
  margin-bottom:10px;
}
.activity ol{margin:0;padding-left:20px;}
.activity ol li{margin-bottom:6px;}
.activity p.open-prompt{margin:4px 0 0 0;}

textarea.answer-box{
  width:100%;
  min-height:90px;
  font-family:'Source Sans 3', sans-serif;
  font-size:.92rem;
  border:1px solid #d8d2c4;
  border-radius:4px;
  padding:10px;
  resize:vertical;
  margin-top:8px;
}

footer.page-footer{
  text-align:center;
  color:#8a8578;
  font-size:.78rem;
  padding:24px;
}

@media (max-width:640px){
  h1.title{font-size:1.5rem;}
  button.tab{font-size:.78rem;padding:9px 10px 9px 10px;}
}


/* ---- Actividades: tarjetas de partes y botones ---- */
.part-grid{display:grid;gap:14px;margin:18px 0;}
.part-card{
  background:#fff;
  border:1px solid #e3ddd0;
  border-left:4px solid var(--oro);
  border-radius:6px;
  padding:16px 20px;
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  align-items:center;
  justify-content:space-between;
}
.part-card .part-info{flex:1 1 340px;}
.part-card h3.part-title{font-size:1.05rem;color:var(--azul-osc);margin:0 0 4px 0;}
.part-card p.part-desc{margin:0;font-size:.92rem;color:#4a4a46;}
.part-card p.part-status{margin:6px 0 0 0;font-size:.78rem;color:#7a7a76;font-style:italic;}
a.btn{
  display:inline-block;
  background:var(--terracota);
  color:#fff;
  text-decoration:none;
  font-family:'Source Sans 3', sans-serif;
  font-weight:700;
  font-size:.9rem;
  padding:10px 20px;
  border-radius:4px;
  white-space:nowrap;
}
a.btn:hover{filter:brightness(1.08);}
a.btn.locked{background:#bdb6a6;cursor:not-allowed;pointer-events:none;}

/* ---- Páginas de actividades ---- */
.mininav a.back{color:#fff;text-decoration:none;font-weight:600;}
.mininav a.back:hover{text-decoration:underline;}
.task{background:#fff;border:1px solid #e3ddd0;border-radius:6px;padding:14px 18px 16px 18px;margin:14px 0;}
.task .task-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.task .task-num{font-family:'Playfair Display', Georgia, serif;font-weight:700;font-size:1.05rem;color:var(--terracota);}
.task .tag{display:inline-block;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:#fff;border-radius:3px;padding:2px 7px;}
.tag-literal{background:var(--turquesa);}
.tag-inferencia{background:var(--azul);}
.tag-forma{background:var(--oro);}
.tag-global{background:var(--terracota);}
.task p.task-text{margin:0;}
p.sec-note{margin:-6px 0 12px 0;font-size:.9rem;color:#5a5a55;font-style:italic;}

</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <p class="eyebrow">1º de Bachillerato · Educación literaria · Prerrenacimiento</p>
    <h1 class="title">La Celestina</h1>
    <p class="subtitle">Fernando de Rojas — Tragicomedia de Calisto y Melibea. Módulo de estudio para el análisis en profundidad de la obra.</p>
    <nav class="tabs" id="tabs-nav"></nav>
  </div>
</header>

<div class="mininav">
  <div class="mininav-inner">
    <span class="crumb" id="mininav-crumb"></span>
    <span class="counter" id="mininav-counter"></span>
  </div>
</div>

<main>
  <div id="content-root"></div>
</main>

<footer class="page-footer">Material de estudio y consulta · Lengua Castellana y Literatura I</footer>

<script>
(function () {
  'use strict';

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.className) node.className = opts.className;
    if (opts.text) node.appendChild(document.createTextNode(opts.text));
    if (opts.attrs) {
      for (var k in opts.attrs) {
        if (Object.prototype.hasOwnProperty.call(opts.attrs, k)) {
          node.setAttribute(k, opts.attrs[k]);
        }
      }
    }
    (children || []).forEach(function (c) {
      if (c) node.appendChild(c);
    });
    return node;
  }
  function txt(s) { return document.createTextNode(s); }

  function h2(text) { return el('h2', { className: 'sec-title', text: text }); }
  function h3(text) { return el('h3', { className: 'sub-title', text: text }); }
  function p(text) { return el('p', { className: 'body-text', text: text }); }
  function ul(items) {
    return el('ul', { className: 'body-list' }, items.map(function (i) {
      return el('li', { text: i });
    }));
  }
  function callout(label, text) {
    return el('div', { className: 'callout' }, [
      el('span', { className: 'callout-label', text: label }),
      txt(text)
    ]);
  }
  function qbox(text) {
    return el('p', { className: 'qbox', text: text });
  }
  function frag(title, lines, source) {
    var box = el('div', { className: 'frag' });
    if (title) box.appendChild(el('h4', { attrs: {}, text: title }));
    lines.forEach(function (l) {
      if (l.narr) {
        box.appendChild(el('p', { className: 'narr', text: l.narr }));
      } else {
        var pnode = el('p', { className: 'dline' });
        pnode.appendChild(el('b', { text: l.sp + '.\u2014 ' }));
        pnode.appendChild(txt(l.line));
        box.appendChild(pnode);
      }
    });
    if (source) box.appendChild(el('p', { className: 'frag-source', text: source }));
    return box;
  }
  function table(headers, rows) {
    var thead = el('tr', {}, headers.map(function (h) { return el('th', { text: h }); }));
    var tbody = rows.map(function (r) {
      return el('tr', {}, r.map(function (c) { return el('td', { text: c }); }));
    });
    return el('table', { className: 'data-table' }, [el('thead', {}, [thead]), el('tbody', {}, tbody)]);
  }
  /* guided activity: numbered sub-questions */
  function activity(title, levelTag, steps) {
    var box = el('div', { className: 'activity' });
    if (levelTag) box.appendChild(el('span', { className: 'level-tag', text: levelTag }));
    box.appendChild(el('h4', { text: title }));
    box.appendChild(el('ol', {}, steps.map(function (s) { return el('li', { text: s }); })));
    var ta = el('textarea', { className: 'answer-box', attrs: { placeholder: 'Espacio para tomar notas o redactar la respuesta...' } });
    box.appendChild(ta);
    return box;
  }
  /* open activity: single free-commentary prompt, no sub-questions */
  function openActivity(title, levelTag, promptText, minHeight) {
    var box = el('div', { className: 'activity' });
    if (levelTag) box.appendChild(el('span', { className: 'level-tag', text: levelTag }));
    box.appendChild(el('h4', { text: title }));
    box.appendChild(el('p', { className: 'open-prompt', text: promptText }));
    var ta = el('textarea', { className: 'answer-box', attrs: { placeholder: 'Redacta aquí el comentario...' } });
    if (minHeight) ta.style.minHeight = minHeight;
    box.appendChild(ta);
    return box;
  }

  var TABS = [
    { id: 'panorama', label: 'Panorama' },
    { id: 'autoria', label: 'Autoría' },
    { id: 'genero', label: 'Género' },
    { id: 'estructura', label: 'Estructura' },
    { id: 'personajes', label: 'Personajes' },
    { id: 'temas', label: 'Temas' },
    { id: 'estilo', label: 'Estilo' },
    { id: 'contexto', label: 'Contexto y tradición' },
    { id: 'actividades', label: 'Actividades' },
    { id: 'practica', label: 'Práctica guiada' },
    { id: 'creacion', label: 'Creación' }
  ];

  window.CELESTINA_TABS = TABS;
  window.CELESTINA_HELPERS = { el: el, txt: txt, h2: h2, h3: h3, p: p, ul: ul, callout: callout, qbox: qbox, frag: frag, table: table, activity: activity, openActivity: openActivity };
})();
(function () {
  'use strict';
  var H = window.CELESTINA_HELPERS;
  var el = H.el, h2 = H.h2, h3 = H.h3, p = H.p, ul = H.ul, callout = H.callout, table = H.table;

  function build() {
    var panel = el('div', { className: 'panel', attrs: { id: 'panel-panorama' } });

    panel.appendChild(h2('Panorama: de la Edad Media al Prerrenacimiento'));
    panel.appendChild(p('Antes de entrar en La Celestina conviene situarla en el mapa. No es una obra aislada: cierra un periodo y abre otro. Este panorama es deliberadamente breve — una guía de referencia, no un temario completo — porque lo que de verdad se va a trabajar en profundidad es la obra que sigue.'));

    panel.appendChild(h3('La literatura medieval (siglos XII-XIV): grandes líneas'));
    panel.appendChild(ul([
      'Lírica: la lírica tradicional (jarchas, cantigas de amigo) convive con la lírica culta de cancionero, de raíz cortesana.',
      'Poesía narrativa: el mester de clerecía (clérigos que versifican con rigor culto: Gonzalo de Berceo, el Libro de Alexandre) frente al mester de juglaría, de transmisión oral (el Cantar de Mio Cid, épica en torno a un héroe histórico).',
      'Prosa: se consolida con Alfonso X el Sabio (prosa historiográfica y científica) y culmina en el siglo XIV con don Juan Manuel y El conde Lucanor, colección de cuentos con intención moral.',
      'Teatro medieval: escaso y casi siempre litúrgico o paralitúrgico; apenas queda testimonio escrito en castellano (el Auto de los Reyes Magos es la pieza más citada).'
    ]));

    panel.appendChild(h3('El Prerrenacimiento (siglo XV): el siglo de transición'));
    panel.appendChild(p('El XV es un siglo bisagra: conviven todavía formas e ideas medievales (el providencialismo, la visión jerárquica del mundo) con los primeros aires del humanismo italiano —el interés por el individuo, por la Antigüedad clásica, por la Fortuna como fuerza caprichosa que gobierna la vida humana—. Es el siglo en el que España empieza a mirar hacia Italia.'));
    panel.appendChild(table(
      ['Ámbito', 'Autores y obras principales', 'Rasgo que anuncia el cambio'],
      [
        ['Lírica culta', 'Marqués de Santillana (Sonetos fechos al itálico modo); Juan de Mena (Laberinto de Fortuna)', 'Primeros ensayos del endecasílabo italiano; la Fortuna como motivo central'],
        ['Poesía de cancionero', 'Jorge Manrique (Coplas a la muerte de su padre)', 'El tópico medieval del ubi sunt tratado con una hondura ya muy personal'],
        ['Prosa narrativa', 'Novela sentimental: Diego de San Pedro (Cárcel de amor)', 'Introspección amorosa, análisis del sentimiento individual'],
        ['Teatro / comedia humanística', 'La Celestina, de Fernando de Rojas (1499/1502)', 'Diálogo dramático de altísima elaboración psicológica, deudor de la comedia humanística italiana']
      ]
    ));

    panel.appendChild(callout('En el itinerario del curso', 'La Celestina cierra este bloque de transición. A partir de ella entramos en el Renacimiento propiamente dicho (Lazarillo de Tormes, Cervantes) y, más adelante, en el Barroco (El alcalde de Zalamea).'));

    panel.appendChild(h3('¿Por qué "Prerrenacimiento" y no ya "Renacimiento"?'));
    panel.appendChild(p('Porque La Celestina todavía no comparte del todo la visión optimista y armónica que caracterizará al Renacimiento pleno. Al contrario: es una obra profundamente pesimista, donde el amor destruye en lugar de dignificar, donde la Fortuna no se domina y donde el final es la muerte de todos los protagonistas. Por eso los historiadores de la literatura la sitúan en la frontera: formalmente mira ya hacia el humanismo italiano, pero en su visión del mundo conserva mucho del providencialismo y del pesimismo medievales.'));

    document.getElementById('content-root').appendChild(panel);
  }
  window.CELESTINA_BUILDERS = window.CELESTINA_BUILDERS || [];
  window.CELESTINA_BUILDERS.push(build);
})();
(function () {
  'use strict';
  var H = window.CELESTINA_HELPERS;
  var el = H.el, h2 = H.h2, h3 = H.h3, p = H.p, ul = H.ul, callout = H.callout, qbox = H.qbox;

  function build() {
    var panel = el('div', { className: 'panel', attrs: { id: 'panel-autoria' } });

    panel.appendChild(h2('Autoría y génesis del texto'));

    panel.appendChild(h3('Fernando de Rojas'));
    panel.appendChild(ul([
      'Nace hacia 1473 en La Puebla de Montalbán (Toledo), en el seno de una familia de conversos (judíos convertidos al cristianismo), un dato que algunos estudiosos relacionan con la visión desengañada y pesimista de la obra.',
      'Estudia Leyes en la Universidad de Salamanca.',
      'Ejerce como jurista y llega a ser alcalde mayor de Talavera de la Reina, donde muere en 1541.',
      'No volvió a escribir literatura después de La Celestina: es, en la práctica, un autor de una sola obra.'
    ]));

    panel.appendChild(h3('El problema de la doble autoría'));
    panel.appendChild(p('La propia obra plantea el problema desde sus páginas preliminares. En la carta "El autor a un su amigo" y en los versos acrósticos que preceden al texto, Rojas cuenta que encontró un primer acto ya escrito —de autor anónimo, que algunos atribuyeron en su época a Juan de Mena o a Rodrigo Cota— y que él decidió continuarlo "por quince días de vacaciones".'));
    panel.appendChild(qbox('"Yo vi en Salamanca la obra presente; movime a acabarla por estas razones: es la primera, que estoy en vacaciones, la otra, inventarla persona prudente..."'));
    panel.appendChild(p('Los acrósticos formados por las primeras letras de las estrofas preliminares deletrean una frase que identifica al autor como "EL BACHILLER FERNANDO DE ROJAS ACABÓ LA COMEDIA DE CALISTO Y MELIBEA Y FUE NASCIDO EN LA PUEBLA DE MONTALBÁN". Es la propia obra, por tanto, la que se presenta como resultado de dos manos: un autor primitivo (Acto I) y un continuador, Rojas (del Acto II en adelante).'));

    panel.appendChild(callout('Debate crítico', 'La crítica no se pone de acuerdo sobre si esa doble autoría es real o una ficción literaria más —un recurso del propio Rojas para distanciarse de una obra tan atrevida—. Lo que sí es unánime es el reconocimiento de que existe una altísima coherencia de estilo, de caracterización y de visión del mundo entre el Acto I y el resto, lo que ha llevado a muchos filólogos a pensar que Rojas pudo reelaborar también ese primer acto, o que al menos lo asumió por completo como propio.'));

    panel.appendChild(h3('De la Comedia a la Tragicomedia: las dos versiones'));
    panel.appendChild(ul([
      'Comedia de Calisto y Melibea (Burgos, 1499): versión primitiva, en 16 actos.',
      'Tragicomedia de Calisto y Melibea (Sevilla, 1502 y ediciones posteriores): versión ampliada, en 21 actos, con cinco actos añadidos (XV-XIX), el llamado "Tratado de Centurio", que retrasa el desenlace y desarrolla más el mundo de los criados y las prostitutas.',
      'El cambio de título —de Comedia a Tragicomedia— refleja la propia conciencia del autor de que la obra no encaja en el esquema tradicional: no es una comedia porque acaba mal (con la muerte de todos los protagonistas), pero tampoco es una tragedia pura, porque sus personajes no son nobles en el sentido clásico y hay abundantes escenas cómicas y de sátira social.'
    ]));

    panel.appendChild(h3('El "argumento" y los propósitos declarados'));
    panel.appendChild(p('En el prólogo y los preliminares, Rojas presenta la obra con una finalidad moralizante explícita: advertir a los jóvenes ("mancebos") de los engaños de las alcahuetas y de los criados desleales, y de los peligros del amor desordenado. Conviene leer esta declaración con distancia crítica: la fuerza y ambigüedad con que están construidos los personajes —sobre todo Celestina— desbordan con mucho una simple intención didáctica, y es precisamente esa ambigüedad moral la que ha hecho de la obra un clásico.'));

    document.getElementById('content-root').appendChild(panel);
  }
  window.CELESTINA_BUILDERS = window.CELESTINA_BUILDERS || [];
  window.CELESTINA_BUILDERS.push(build);
})();
(function () {
  'use strict';
  var H = window.CELESTINA_HELPERS;
  var el = H.el, h2 = H.h2, h3 = H.h3, p = H.p, ul = H.ul, callout = H.callout, frag = H.frag;

  function build() {
    var panel = el('div', { className: 'panel', attrs: { id: 'panel-genero' } });

    panel.appendChild(h2('Un problema de género: ni novela ni teatro puro'));
    panel.appendChild(p('La Celestina se estudia habitualmente junto a las obras narrativas del itinerario, y sin embargo está escrita íntegramente en forma dialogada, sin apenas acotaciones, como una obra de teatro. Este cruce de géneros es en sí mismo uno de los rasgos más estudiados de la obra y conviene entenderlo antes de analizar cualquier otro aspecto.'));

    panel.appendChild(h3('¿Por qué se lee como narrativa?'));
    panel.appendChild(ul([

      { sp: 'CALISTO', line: 'En dar poder a natura que de tan perfecta hermosura te dotase, y hacer a m\u00ed, inm\u00e9rito, tanta merced que verte alcanzase, y en tan conveniente lugar, que mi secreto dolor manifestarte pudiese. Sin duda, incomparablemente es mayor tal galard\u00f3n que el servicio, sacrificio, devoci\u00f3n y obras p\u00edas que por este lugar alcanzar tengo yo a Dios ofrecido.' },
      { sp: 'MELIBEA', line: '\u00bfPor gran premio tienes \u00e9ste, Calisto?' },
      { sp: 'CALISTO', line: 'T\u00e9ngolo por tanto, en verdad, que si Dios me diese en el cielo silla sobre sus santos, no lo tendr\u00eda por tanta felicidad.' },
      { sp: 'MELIBEA', line: 'Pues aun m\u00e1s igual galard\u00f3n te dar\u00e9 yo si perseveras.' },
      { sp: 'CALISTO', line: '\u00a1Oh bienaventuradas orejas m\u00edas, que indignamente tan gran palabra hab\u00e9is o\u00eddo!' },
      { sp: 'MELIBEA', line: 'M\u00e1s desaventuradas de que me acabes de o\u00edr, porque la paga ser\u00e1 tan fiera cual merece tu loco atrevimiento... \u00a1Vete, vete de ah\u00ed, torpe!, que no puede mi paciencia tolerar que haya subido en coraz\u00f3n humano conmigo en il\u00edcito amor comunicar su deleite.' }
    ], 'Acto I'));
    panel.appendChild(activity('Cuestiones sobre el fragmento 1', 'Nivel 1 \u00b7 con preguntas gu\u00eda', [
      'Sitúa este fragmento dentro de la estructura de la obra: ¿qué momento de la acción es y qué función cumple respecto a todo lo que viene después?',
      'Explica cómo habla Calisto: identifica al menos dos recursos propios del lenguaje del amor cortés y comenta el efecto de exageración religiosa en su discurso.',
      'Contrasta la actitud de Melibea aquí con la que tendrá más adelante en la obra. ¿Qué contraste dramático genera esto?'
    ]));

    /* NIVEL 2 — Fragmento 2: Pármeno, guía reducida */
    panel.appendChild(h3('Fragmento 2 \u2014 Pármeno describe a Celestina (Acto I)'));
    panel.appendChild(frag(null, [
      { sp: 'P\u00c1RMENO', line: 'Ella ten\u00eda seis oficios; conviene saber: labrandera, perfumera, maestra de hacer afeites y de hacer virgos, alcahueta y un poquito hechicera... Ninguna vino sin torrezno, trigo, harina o jarro de vino, y de las otras provisiones que pod\u00edan a sus amas hurtar.' },
      { sp: 'CALISTO', line: '\u00a1As\u00ed pudiera ciento!' },
      { sp: 'P\u00c1RMENO', line: '\u00a1S\u00ed, santo Dios! Y remediaba por caridad muchas hu\u00e9rfanas y erradas que se encomendaban a ella.' }
    ], 'Acto I'));
    panel.appendChild(activity('Cuestiones sobre el fragmento 2', 'Nivel 2 \u00b7 gu\u00eda reducida', [
      'Explica la función de este fragmento en la obra y comenta su ironía, apoyándote en al menos una cita textual.',
      'A partir de aquí y de lo visto en "Personajes" y "Contexto", valora qué papel social cumplía una figura como Celestina en su época.'
    ]));

    /* NIVEL 3 — Fragmento 3: comentario abierto, sin preguntas */
    panel.appendChild(h3('Fragmento 3 \u2014 Celestina habla de la vejez (Acto IV)'));
    panel.appendChild(frag(null, [
      { sp: 'MELIBEA', line: '\u00bfPor qu\u00e9 dices, madre, tanto mal de lo que todo el mundo con tanta eficacia gozar y ver desea?' },
      { sp: 'CELESTINA', line: 'Desean harto mal para s\u00ed... \u00bfQui\u00e9n te podr\u00eda contar, se\u00f1ora, sus da\u00f1os, sus inconvenientes, sus fatigas, sus cuidados, sus enfermedades... aquel arrugar de cara, aquel mudar de cabellos su primera y fresca color, aquel poco o\u00edr, aquel debilitado ver... aquel espacioso comer? Pues \u00a1ay, ay, se\u00f1ora!, si lo dicho viene acompa\u00f1ado de pobreza, all\u00ed ver\u00e1s callar todos los otros trabajos.' }
    ], 'Acto IV'));
    panel.appendChild(openActivity(
      'Comentario del fragmento 3',
      'Nivel 3 \u00b7 sin preguntas gu\u00eda',
      'Redacta un comentario de este fragmento, sin preguntas intermedias que lo dirijan. Tu comentario debe situar el fragmento en la obra, explicar la intervención de cada personaje, identificar al menos un recurso de estilo propio del registro empleado y relacionar el pasaje con alguno de los temas trabajados en la pestaña "Temas". Organízalo tú misma: decide el orden y el peso que le das a cada aspecto.',
      '160px'
    ));

    document.getElementById('content-root').appendChild(panel);
  }
  window.CELESTINA_BUILDERS = window.CELESTINA_BUILDERS || [];

(function () {
  'use strict';

  function init() {
    var TABS = window.CELESTINA_TABS;
    var tabsNav = document.getElementById('tabs-nav');
    var mininavCrumb = document.getElementById('mininav-crumb');
    var mininavCounter = document.getElementById('mininav-counter');

    (window.CELESTINA_BUILDERS || []).forEach(function (fn) { fn(); });

    TABS.forEach(function (t, idx) {
      var btn = document.createElement('button');
      btn.className = 'tab';
      btn.type = 'button';
      btn.setAttribute('data-tab', t.id);
      btn.appendChild(document.createTextNode(t.label));
      btn.addEventListener('click', function () {
        activate(t.id, idx);
      });
      tabsNav.appendChild(btn);
    });

    function activate(id, idx) {
      var panels = document.querySelectorAll('.panel');
      for (var i = 0; i < panels.length; i++) {
        panels[i].classList.remove('active');
      }
      var target = document.getElementById('panel-' + id);
      if (target) target.classList.add('active');

      var buttons = tabsNav.querySelectorAll('.tab');
      for (var j = 0; j < buttons.length; j++) {
        buttons[j].classList.remove('active');
      }
      var activeBtn = tabsNav.querySelector('[data-tab="' + id + '"]');
      if (activeBtn) activeBtn.classList.add('active');

      var tabInfo = TABS.filter(function (t) { return t.id === id; })[0];
      if (tabInfo) {
        mininavCrumb.textContent = '';
        var b = document.createElement('b');
        b.appendChild(document.createTextNode(tabInfo.label));
        mininavCrumb.appendChild(document.createTextNode('La Celestina \u2014 '));
        mininavCrumb.appendChild(b);
      }
      var position = TABS.findIndex(function (t) { return t.id === id; }) + 1;
      mininavCounter.textContent = position + ' / ' + TABS.length;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    activate(TABS[0].id, 0);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

(function () {
  'use strict';
  var H = window.CELESTINA_HELPERS;
  var el = H.el, h2 = H.h2, p = H.p, ul = H.ul, callout = H.callout;
  var CARDS = [{"file": "actos-preliminares-1.html", "title": "Preliminares y Acto I · Tarea grupal", "desc": "Carta, prólogo y primer acto, en grupos de cuatro. Unos 30 minutos."}, {"file": "actos-2-6.html", "title": "Actos II–VI", "desc": "Seis tareas breves: comprensión literal, interpretación y estilo."}, {"file": "actos-7-11.html", "title": "Actos VII–XI", "desc": "Seis tareas breves: comprensión literal, interpretación y estilo."}, {"file": "actos-12-16.html", "title": "Actos XII–XVI", "desc": "Seis tareas breves: comprensión literal, interpretación y estilo."}, {"file": "actos-17-21.html", "title": "Actos XVII–XXI", "desc": "Seis tareas breves: comprensión literal, interpretación y estilo."}, {"file": "tarea-global.html", "title": "Tarea global final", "desc": "Una tarea que reúne toda la obra, para después de terminar la lectura."}];

  function setState(card, available) {
    var btn = card.querySelector('a.btn');
    var status = card.querySelector('p.part-status');
    if (available) {
      btn.classList.remove('locked');
      btn.removeAttribute('aria-disabled');
      btn.textContent = 'Abrir actividades';
      status.textContent = 'Disponible.';
    } else {
      btn.classList.add('locked');
      btn.setAttribute('aria-disabled', 'true');
      btn.textContent = 'Aún no disponible';
      status.textContent = 'Se activará cuando terminéis la lectura de esta parte.';
    }
  }

  function checkAvailable(file) {
    if (window.location.protocol === 'file:' || typeof window.fetch !== 'function') {
      return Promise.resolve(true);
    }
    return window.fetch(file, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      return r.ok;
    }).catch(function () { return false; });
  }

  function build() {
    var panel = el('div', { className: 'panel', attrs: { id: 'panel-actividades' } });
    panel.appendChild(h2('Actividades por actos'));
    panel.appendChild(p('La obra se trabaja por partes: primero los preliminares y el acto I, después cuatro bloques de cinco actos y, al final, una tarea global. Cada botón se activa cuando se publica la parte correspondiente, a medida que avanza la lectura.'));
    panel.appendChild(ul([
      'Comprensión literal: qué ocurre, quién interviene, qué se dice.',
      'Interpretación e inferencia: por qué ocurre y qué significa; hay que apoyarse en el texto.',
      'Forma y estilo: cómo está escrito y qué efecto producen los recursos.'
    ]));

    var grid = el('div', { className: 'part-grid' });
    CARDS.forEach(function (c) {
      var info = el('div', { className: 'part-info' }, [
        el('h3', { className: 'part-title', text: c.title }),
        el('p', { className: 'part-desc', text: c.desc }),
        el('p', { className: 'part-status', text: '' })
      ]);
      var btn = el('a', { className: 'btn locked', attrs: { href: c.file } });
      btn.appendChild(document.createTextNode('Aún no disponible'));
      var card = el('div', { className: 'part-card' }, [info, btn]);
      setState(card, false);
      grid.appendChild(card);
      checkAvailable(c.file).then(function (ok) { setState(card, ok); });
    });
    panel.appendChild(grid);

    panel.appendChild(callout('Cómo trabajar', 'Lee primero los actos de la parte y después abre sus actividades. Cada respuesta se guarda en tu navegador mientras escribes, pero conviene copiar el trabajo final en el documento que se te pida entregar.'));

    document.getElementById('content-root').appendChild(panel);
  }
  window.CELESTINA_BUILDERS = window.CELESTINA_BUILDERS || [];
  window.CELESTINA_BUILDERS.push(build);
})();
