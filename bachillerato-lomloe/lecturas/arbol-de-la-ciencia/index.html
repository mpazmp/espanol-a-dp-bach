<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El árbol de la ciencia · 2º Bachillerato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #1a4a7a;
  --azul-osc: #0f2f4d;
  --turquesa: #0e9aa7;
  --terracota: #c64829;
  --oro: #c9973a;
  --crema: #faf7f1;
  --tinta: #1f2a36;
  --tinta-suave: #4a5866;
  --linea: #e4ddd0;
  --blanco: #ffffff;
  --ok: #2e7d4f;
  --no: #b3261e;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--crema);
  color: var(--tinta);
  font-family: 'Source Sans 3', 'Source Sans Pro', system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.6;
  padding-bottom: 72px;
}
h1, h2, h3, .titulo, .panel-titulo { font-family: 'Playfair Display', Georgia, serif; }

/* Cabecera */
.cabecera { background: var(--azul); color: var(--blanco); }
.cabecera-in { max-width: 920px; margin: 0 auto; padding: 28px 16px 0; }
.volver { display: inline-block; color: rgba(255,255,255,.8); font-size: 14px; text-decoration: none; margin-bottom: 10px; }
.volver:hover { color: #fff; text-decoration: underline; }
.eyebrow { color: #7fdce4; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
.titulo { font-size: clamp(26px, 5vw, 38px); line-height: 1.15; margin: 0 0 8px; font-weight: 700; }
.subtitulo { margin: 0 0 18px; color: rgba(255,255,255,.85); max-width: 680px; }
.pestanas { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.pestanas::-webkit-scrollbar { display: none; }
.pestana {
  flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent;
  color: rgba(255,255,255,.55); font: inherit; font-size: 15px; font-weight: 600;
  padding: 12px 12px 10px; cursor: pointer; white-space: nowrap;
}
.pestana:hover { color: rgba(255,255,255,.85); }
.pestana.activa { color: var(--blanco); border-bottom-color: var(--terracota); }
.divisor { height: 3px; background: var(--terracota); }

/* Contenido */
.contenido { max-width: 920px; margin: 0 auto; padding: 24px 16px 32px; }
.panel-eyebrow { color: var(--turquesa); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 700; margin: 8px 0 2px; }
.panel-titulo { font-size: clamp(24px, 4vw, 30px); color: var(--azul); margin: 0 0 16px; }
h2 { color: var(--azul); font-size: 23px; margin: 32px 0 10px; }
h3 { color: var(--azul-osc); font-size: 19px; margin: 22px 0 8px; }
p { margin: 0 0 12px; }
.lead { font-size: 18.5px; color: var(--tinta); }
strong { font-weight: 700; }
mark.marcador { background: #f6e6c4; color: inherit; padding: 0 2px; border-radius: 2px; }

.badge { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 3px; margin: 4px 0 10px; }
.badge-oficial { background: var(--azul-osc); color: var(--blanco); }
.badge-dep { background: transparent; color: var(--oro); border: 1.5px solid var(--oro); }

.aviso { background: var(--turquesa); color: var(--blanco); padding: 14px 18px; border-radius: 4px; margin: 18px 0; }
.aviso p { margin: 0; }
.aviso .aviso-titulo { font-weight: 700; margin-bottom: 4px; }
.aviso strong { color: var(--blanco); }

.lista { padding-left: 1.3em; margin: 0 0 14px; }
.lista li { margin-bottom: 6px; }

.tabla-wrap { overflow-x: auto; margin: 10px 0 18px; }
.tabla { width: 100%; border-collapse: collapse; background: var(--blanco); font-size: 15.5px; min-width: 480px; }
.tabla th { background: var(--azul-osc); color: var(--blanco); text-align: left; padding: 9px 10px; font-weight: 600; }
.tabla td { padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }

.card { background: var(--blanco); border: 1px solid var(--linea); border-top: 4px solid var(--azul); border-radius: 4px; padding: 18px 20px 8px; margin: 18px 0; }
.card-terracota { border-top-color: var(--terracota); }
.card-oro { border-top-color: var(--oro); }
.card-turquesa { border-top-color: var(--turquesa); }
.card-eyebrow { color: var(--turquesa); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 700; margin: 0 0 2px; }
.card-titulo { margin-top: 0; }

.item-cita { font-style: italic; margin-bottom: 8px; background: var(--blanco); border-left: 4px solid var(--oro); padding: 12px 14px; }

.boton {
  display: inline-block; background: var(--terracota); color: var(--blanco); border: 0; border-radius: 4px;
  padding: 10px 16px; font: inherit; font-size: 15.5px; font-weight: 600; cursor: pointer; text-decoration: none;
}
.boton:hover { filter: brightness(1.08); }
.boton-sec { background: transparent; color: var(--terracota); border: 1.5px solid var(--terracota); }

.ejercicio { background: var(--blanco); border: 1px solid var(--linea); border-left: 4px solid var(--terracota); border-radius: 4px; padding: 16px 18px; margin: 18px 0; }
.ejercicio-titulo { font-weight: 700; color: var(--terracota); margin-bottom: 6px; }
.ejercicio-intro { color: var(--tinta-suave); }
.selector { font: inherit; font-size: 15.5px; padding: 6px 8px; border: 1.5px solid var(--linea); border-radius: 4px; background: var(--crema); color: var(--tinta); max-width: 100%; }

/* Escritura */
.escritura { margin: 16px 0 20px; }
.escritura-label { display: block; font-weight: 600; color: var(--azul-osc); margin-bottom: 4px; }
.escritura-pista { font-size: 15px; color: var(--tinta-suave); margin-bottom: 6px; }
.escritura-area {
  width: 100%; font: inherit; font-size: 16.5px; line-height: 1.55; padding: 12px; border: 1.5px solid var(--linea);
  border-radius: 4px; background: var(--blanco); color: var(--tinta); resize: vertical;
}
.escritura-area:focus { outline: none; border-color: var(--azul); }
.escritura-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--tinta-suave); margin-top: 4px; }
.contador { font-weight: 600; }
.contador-bajo { color: var(--oro); }
.contador-alto { color: var(--no); }
.contador-ok { color: var(--ok); }

.reloj { background: var(--azul-osc); color: var(--blanco); border-radius: 4px; padding: 14px 18px; margin: 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.reloj p { margin: 0; }
.reloj-label { font-weight: 600; flex: 1 1 200px; }
.reloj-display { font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-variant-numeric: tabular-nums; }
.reloj-botones { display: flex; gap: 6px; flex-wrap: wrap; }
.reloj .boton-sec { color: var(--blanco); border-color: rgba(255,255,255,.6); }
.reloj-msg { flex-basis: 100%; color: #ffd9cf; font-weight: 600; }
.reloj-msg:empty { display: none; }
.reloj-fin { background: var(--terracota); }

.autoeval-fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--linea); flex-wrap: wrap; }
.autoeval-label { flex: 1 1 260px; }
.autoeval-total { font-weight: 700; color: var(--azul); text-align: right; margin: 10px 0 0; font-size: 18px; }

.copiar { margin: 20px 0; }
.copiar-nota { font-size: 15px; color: var(--tinta-suave); }
.copiar-msg { margin-left: 10px; font-size: 14.5px; color: var(--ok); }

.pie { font-size: 13.5px; color: var(--tinta-suave); border-top: 1px solid var(--linea); padding-top: 12px; margin-top: 36px; }

/* Mini-navegación inferior */
.mininav {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--azul-osc); color: var(--blanco);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; z-index: 10;
}
.mininav-btn { background: none; border: 1px solid rgba(255,255,255,.35); color: var(--blanco); border-radius: 4px; padding: 7px 12px; font: inherit; font-size: 14.5px; cursor: pointer; }
.mininav-btn:disabled { opacity: .35; cursor: default; }
.mininav-pos { font-size: 14px; color: rgba(255,255,255,.8); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 520px) {
  body { font-size: 16.5px; }
  .card, .ejercicio { padding: 14px 14px 6px; }
  .mininav-pos { font-size: 12.5px; }
}
</style>
</head>

    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!p) { continue; }
      if (p.indexOf('**') === 0 && p.length > 4) {
        parent.appendChild(el('strong', null, p.slice(2, -2)));
      } else if (p.indexOf('==') === 0 && p.length > 4) {
        parent.appendChild(el('mark', 'marcador', p.slice(2, -2)));
      } else if (p.charAt(0) === '*' && p.length > 2) {

    btn.addEventListener('click', function () {
      var lines = [D.title + ' · ' + D.course, ''];
      writeFields.forEach(function (f) {
        if (b.ids && b.ids.indexOf(f.id) === -1) { return; }
        lines.push('## ' + f.label);
        lines.push(f.node.value.trim() || '(sin respuesta)');
        lines.push('');
      });
      var text = lines.join('\n');
      function fallback() {
        var ta = el('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); msg.textContent = 'Copiado.'; } catch (e) { msg.textContent = 'No se pudo copiar.'; }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { msg.textContent = 'Copiado. Pégalo donde te indique tu profesora.'; }, fallback);
      } else {
        fallback();
      }
    });
    if (b.note) { add(wrap, inline(el('p', 'copiar-nota'), b.note)); }
    return add(wrap, btn, msg);
  };

  function renderBlocks(parent, blocks) {
    blocks.forEach(function (b) {
      var fn = R[b.t];
      if (fn) { parent.appendChild(fn(b)); }
    });
  }

  /* ---------- página ---------- */
  function build() {
    var root = document.getElementById('app');
    var header = el('header', 'cabecera');
    var hin = el('div', 'cabecera-in');
    if (D.back) {
      var back = el('a', 'volver', D.back.x);
      back.href = D.back.href;
      add(hin, back);
    }
    add(hin, el('p', 'eyebrow', D.eyebrow));
    add(hin, el('h1', 'titulo', D.title));
    if (D.subtitle) { add(hin, inline(el('p', 'subtitulo'), D.subtitle)); }
    var nav = el('nav', 'pestanas');
    nav.setAttribute('role', 'tablist');
    add(hin, nav);
    add(header, hin);
    add(root, header, el('div', 'divisor'));

    var main = el('main', 'contenido');
    add(root, main);

    var tabBtns = [];
    var panels = [];
    D.tabs.forEach(function (tab, i) {
      var btn = el('button', 'pestana', tab.label);
      btn.type = 'button';
      btn.setAttribute('role', 'tab');
      btn.addEventListener('click', function () { show(i); });
      tabBtns.push(btn);
      add(nav, btn);
      var panel = el('section', 'panel');
      panel.setAttribute('role', 'tabpanel');
      add(panel, el('p', 'panel-eyebrow', 'Pestaña ' + (i + 1) + ' de ' + D.tabs.length));
      add(panel, el('h2', 'panel-titulo', tab.title || tab.label));
      renderBlocks(panel, tab.blocks);
      panels.push(panel);
      add(main, panel);
    });
    if (D.footer) { add(main, inline(el('p', 'pie'), D.footer)); }

    var bar = el('div', 'mininav');
    var bPrev = el('button', 'mininav-btn', '← Anterior');
    bPrev.type = 'button';
    var pos = el('span', 'mininav-pos');
    var bNext = el('button', 'mininav-btn', 'Siguiente →');
    bNext.type = 'button';
    add(bar, bPrev, pos, bNext);
    add(root, bar);

    var current = 0;
    function show(i, noScroll) {
      current = i;
      panels.forEach(function (p, k) { p.hidden = k !== i; });
      tabBtns.forEach(function (b, k) {
        b.classList.toggle('activa', k === i);
        b.setAttribute('aria-selected', k === i ? 'true' : 'false');
      });
      pos.textContent = (i + 1) + ' / ' + panels.length + ' · ' + D.tabs[i].label;
      bPrev.disabled = i === 0;
      bNext.disabled = i === panels.length - 1;
      save('tab', String(i));
      if (!noScroll) { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    }
    bPrev.addEventListener('click', function () { if (current > 0) { show(current - 1); } });
    bNext.addEventListener('click', function () { if (current < panels.length - 1) { show(current + 1); } });

    var start = Number(load('tab'));
    if (!(start >= 0 && start < panels.length)) { start = 0; }
    show(start, true);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();
</script>
</body>
</html>
